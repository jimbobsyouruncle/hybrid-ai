services:
  hermes:
    build:
      context: ./hermes
      dockerfile: Dockerfile
    container_name: hermes-agent
    restart: unless-stopped
    # `-p default` is load-bearing: a sticky named active profile (e.g. ciso)
    # is refused a gateway ("Profile '<name>' does not get a gateway of its
    # own"), because the single gateway per host is owned by the default
    # profile.
    command: ["bash", "-c", "source ~/.bashrc && hermes -p default gateway run --replace & exec python3 bootstrap.py --host 0.0.0.0 --foreground --no-browser 8501"]
    ports:
      - "${HERMES_PORT:-8501}:8501"
      - "${HERMES_API_PORT:-8642}:8642"
    volumes:
      - ./hermes_data:/root/.hermes
      # Persistent WebUI workspace: the same host folder the container already
      # sees at /root/.hermes/workspace, mounted here at the WebUI Home path so
      # it survives a container recreate. Read-write.
      - ./hermes_data/workspace:/root/workspace
      # The agent clone, NOT the deployment directory. The deployment directory
      # holds .env (RunPod key, WebUI secret) and the logs. Read-only: Hermes
      # reads code here; changes go through OpenHands or you.
      - ${OPENHANDS_WORKSPACE:?OPENHANDS_WORKSPACE must be set - run ./install.sh}:/workspace:ro
      # The SAME clone again, at /agent-repo, also read-only. This is the view
      # Hermes uses to read the OpenHands working clone as a repository, and it
      # is deliberately a separate mount point from /workspace so the two roles
      # are distinguishable in docs and diagnostics. `:ro` is load-bearing:
      # Hermes reads the clone; it must never write to it. The clone is never
      # the deployment directory (scripts/setup-agent-workspace.sh refuses that).
      - ${OPENHANDS_WORKSPACE:?OPENHANDS_WORKSPACE must be set - run ./install.sh}:/agent-repo:ro
      # The read-only reference tree of every non-fork repo you own, one clone
      # per repo on its own default branch, built by scripts/sync-agent-repos.sh.
      # Separate from the OpenHands clone above, so Hermes can read code and
      # agent-context markdown files regardless of which ai/* branch OpenHands
      # last left checked out. `${AGENT_REPOS_DIR:-...}` defaults to
      # ${HOME}/hybrid-ai-repos when AGENT_REPOS_DIR is unset (Docker Compose
      # expands the nested default), so a compose parse with no .env still
      # succeeds. `:ro` is load-bearing: Hermes reads this tree, never writes.
      # The script refuses any path that is, contains, or is inside the
      # deployment dir or the OpenHands workspace, so .env stays out of reach.
      - ${AGENT_REPOS_DIR:-${HOME}/hybrid-ai-repos}:/agent-repos:ro
    # Two networks, deliberately:
    #   default   -- the shared `hybrid-ai` stack network (unchanged).
    #   coder-net -- the internal network shared only with `openhands`, so
    #                Hermes reaches the OpenHands API at http://openhands:3000
    #                by service name. `coder-net` is `internal: true`; it adds
    #                no host port binds and gives Hermes no route to the LAN or
    #                the internet.
    networks:
      - default
      - coder-net
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LOCAL_DOMAIN=${LOCAL_DOMAIN}
      - HERMES_WEBUI_FOREGROUND=1
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8501
