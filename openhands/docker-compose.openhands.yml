# ---------------------------------------------------------------------------
# FILE: openhands/docker-compose.openhands.yml
# PURPOSE (plain English):
#   Runs OpenHands, the agent that maintains this project's code for you.
#   It is an OVERLAY: it adds one service to the main docker-compose.yml rather
#   than replacing it. Always pass BOTH files together:
#
#       docker compose -f docker-compose.yml \
#                      -f openhands/docker-compose.openhands.yml \
#                      --env-file .env <command>
#
#   WHY THAT MATTERS: "up -d --remove-orphans" WITHOUT this file treats the
#   OpenHands container as an orphan and DELETES it. install.sh uses
#   --remove-orphans on every run. Prefer openhands/scripts/openhands-control.sh,
#   which always passes both files.
#
# SECURITY -- read before changing anything here:
#
#   1. DOCKER SOCKET. OpenHands creates sandbox containers, so it needs
#      /var/run/docker.sock. Socket access is effectively root on this host.
#      That is why the port below binds to 127.0.0.1 ONLY, and why there is no
#      Caddy route. Reach it over an SSH tunnel across Tailscale:
#
#          ssh -L 3001:127.0.0.1:3001 <user>@<pi-tailnet-name>
#
#   2. WORKSPACE ISOLATION (the important one). OPENHANDS_WORKSPACE points at
#      a SEPARATE CLONE of the repository -- never at this deployment
#      directory, which holds .env, install.log and backup.log. The sandbox
#      runs as your uid, so file permissions would NOT stop it reading them.
#
#      The sandbox is the component that processes untrusted repository text.
#      It is precisely the component that must not have your credentials in
#      reach. scripts/setup-agent-workspace.sh creates and guards that clone.
#
#      The variable is REQUIRED -- no default. If unset, compose fails loudly
#      rather than silently falling back to something unsafe.
#
#   3. no-new-privileges is set, but be honest about what it buys: it limits
#      setuid escalation inside a container that already holds a socket
#      capable of creating privileged containers. Keep it; do not rely on it.
# ---------------------------------------------------------------------------
services:
  openhands:
    image: ${OPENHANDS_IMAGE:-docker.openhands.dev/openhands/openhands:1.10}
    container_name: hybrid-ai-openhands
    restart: unless-stopped

    # 127.0.0.1 is deliberate and load-bearing. Changing this to 0.0.0.0 would
    # publish arbitrary code execution as root to your LAN.
    ports:
      - "127.0.0.1:${OPENHANDS_PORT:-3001}:3000"
      # Docker bridge only, so sandboxes can post webhooks. Not exposed to the LAN.
      - "172.17.0.1:${OPENHANDS_PORT:-3001}:3000"

    environment:
      # The default is now the DERIVED hybrid image
      # (ghcr.io/jimbobsyouruncle/openhands-agent-server-hybrid), which adds
      # shellcheck/sqlite3/rsync/restic on top of the stock agent-server.
      #
      # Why the repository string still matters: the app server treats
      # ghcr.io/openhands/agent-server as its own reserved repository. When that
      # exact canonical string is set, it silently re-pins AGENT_SERVER_IMAGE_TAG
      # to the SDK version bundled in the app-server image, so the tag below would
      # be ignored. Never set an OpenHands-canonical repository here.
      # ghcr.io/jimbobsyouruncle/openhands-agent-server-hybrid is NOT an
      # OpenHands-canonical name, so the pinned tag should be honoured -- pending
      # the post-merge live check.
      AGENT_SERVER_IMAGE_REPOSITORY: ${OPENHANDS_AGENT_IMAGE_REPOSITORY:-ghcr.io/jimbobsyouruncle/openhands-agent-server-hybrid}
      AGENT_SERVER_IMAGE_TAG: ${OPENHANDS_AGENT_IMAGE_TAG:-1.37.1-python-hybrid.3}

      # Off by default: event logs are verbose and can echo file contents from
      # the workspace. Turn on temporarily when debugging, then turn it back off.
      LOG_ALL_EVENTS: ${OPENHANDS_LOG_ALL_EVENTS:-false}

      OH_PERSISTENCE_DIR: /.openhands
      # NOTE: whether agent-server 1.37.1 honours SANDBOX_USER_ID is unverified
      # offline. install.sh does not assume either way: it pulls the image and
      # derives the sandbox uid dynamically (docker run --entrypoint id ... -u
      # openhands), then grants that uid access to the workspace via ACLs.
      SANDBOX_USER_ID: ${HYBRID_AI_UID:-${STATUS_UID:-1000}}

      # The isolated clone -- NOT this directory. See note 2 above.
      # No default: fail loudly rather than fall back to something unsafe.
      SANDBOX_VOLUMES: ${OPENHANDS_WORKSPACE:?OPENHANDS_WORKSPACE must be set - run ./install.sh}:/workspace:rw

      # --- Sandbox connectivity --------------------------------------------
      # Legacy names are deliberate: this build's fallback config path reads
      # SANDBOX_HOST_PORT, not OH_SANDBOX_HOST_PORT. Without it, sandbox
      # webhooks go to host port 3000 (Open WebUI) and fail with 405.
      SANDBOX_HOST_PORT: ${OPENHANDS_PORT:-3001}
      # The browser connects directly to each sandbox's random host port.
      # Must be a host/IP the browser can reach (Pi LAN IP or DNS name), not localhost.
      SANDBOX_CONTAINER_URL_PATTERN: http://${OPENHANDS_SANDBOX_HOST:?OPENHANDS_SANDBOX_HOST must be set - run ./install.sh}:{port}
      # This app-server build waits only its built-in 15s for a new sandbox to
      # answer /health. This Pi's agent-server answers at ~21s, so a start that
      # loses that race is marked terminally ERROR ("500: Sandbox entered error
      # state") and never recovers. Raise the window so the start can finish.
      SANDBOX_STARTUP_GRACE_SECONDS: ${OPENHANDS_STARTUP_GRACE_SECONDS:-120}
      # Browser origins when the UI is reached through an SSH tunnel.
      # Browsers treat localhost and 127.0.0.1 as different origins, so allow both.
      OH_PERMITTED_CORS_ORIGINS_0: http://localhost:${OPENHANDS_PORT:-3001}
      OH_PERMITTED_CORS_ORIGINS_1: http://127.0.0.1:${OPENHANDS_PORT:-3001}

      # --- Cloud GPU settings & MagicDNS -----------------------------------
      RUNPOD_HOST: ${RUNPOD_HOST}
      PI_HOST: ${PI_HOST}

    dns:
      - 100.100.100.100

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Holds LLM provider credentials. Lives outside the repo so it is never
      # committed and never visible to the sandbox. Mode 0700. Resolved by
      # scripts/lib/hybrid-ai-env.sh; the default keeps today's path.
      - ${OPENHANDS_STATE_DIR:-${HOME}/.openhands}:/.openhands

    extra_hosts:
      - host.docker.internal:host-gateway

    # Two networks, deliberately:
    #   default   -- the shared `hybrid-ai` stack network (unchanged).
    #   coder-net -- the internal network shared only with `hermes`, so Hermes
    #                can reach this API at http://openhands:3000 by service
    #                name without a host port. `coder-net` is `internal: true`
    #                and defined in docker-compose.yml.
    # Listing `default` explicitly keeps OpenHands on the shared network; the
    # later phase that removes it will delete this line, not add one.
    networks:
      - default
      - coder-net

    security_opt:
      - no-new-privileges:true

    # A Pi 5 with 16 GB runs Ollama and Open WebUI alongside this. Without a
    # ceiling, a long agent session can starve the serving path -- and what you
    # would notice is chat getting slow, not OpenHands misbehaving.
    # The ceiling is 2.5 CPUs and 3 GB of memory. The host has four cores, so
    # 2.5 CPUs leaves headroom for Ollama, Open WebUI, and Hermes.
    deploy:
      resources:
        limits:
          memory: ${OPENHANDS_MEM_LIMIT:-3g}
          cpus: "${OPENHANDS_CPUS:-2.5}"

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      # Generous: the first start pulls a large image on modest hardware.
      start_period: 120s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
