# ---------------------------------------------------------------------------
# FILE: .github/workflows/validate.yml
# PURPOSE (plain English):
#   A reusable "recipe" that checks the sources before anything is built or
#   deployed. It is not triggered on its own; another workflow calls it with
#   `uses: ./.github/workflows/validate.yml`.
#
#   Two callers use it:
#
#     1. sast-checks.yml, on every pull request to main (the PR gate).
#     2. deploy.yml, on every push to main (before touching the Pi).
#
#   Because it is a `workflow_call` workflow, it only ever receives the code
#   and never any secret. The steps below read the tree; they do not talk to
#   the network beyond installing a pinned test dependency.
# ---------------------------------------------------------------------------

name: Validate sources

on: workflow_call

permissions:
  contents: read          # least privilege: the job only needs to read code

jobs:
  validate:
    name: Validate sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shell syntax check
        # "bash -n" parses a script without running it. Catches typos and
        # unbalanced quotes safely.
        run: |
          # Every shell script in the repo, found rather than listed -- a
          # hardcoded list silently stops covering new files.
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || fail=1
          done < <(git ls-files '*.sh')
          exit $fail

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Python syntax check
        # status/app.py is bind-mounted straight into the container with no
        # build step, so a syntax error there ships undetected.
        run: |
          fail=0
          while IFS= read -r f; do
            python -m py_compile "$f" || fail=1
          done < <(git ls-files '*.py')
          exit $fail

      - name: Generated pipe is in sync with its sources
        # runpod_pipe.py is concatenated from runpod_core.py and
        # pipe_wrapper.py. A forgotten rebuild means the file you paste into
        # Open WebUI is not the code that was reviewed.
        run: python3 openwebui/build_pipe.py --check

      - name: Install test dependency (httpx)
        # Behavioural tests import httpx, which this job does not otherwise install.
        run: python -m pip install "httpx==0.28.1"

      - name: Pipe behavioural tests
        # Mesh-address enforcement, credential scrubbing and stream-truncation
        # detection are security properties, not conveniences.
        run: python3 openwebui/test_refactor.py

      - name: Backup script fixture tests
        # backup.sh must never build SQL text or a SQLite URI from a file name
        # found in container-written data, must verify captured databases, and
        # must report a run that missed durable state as incomplete. Fully
        # offline: restic, docker and systemctl are stubbed on PATH.
        run: bash scripts/test-backup.sh

      - name: Shared path helper tests
        # Offline. Proves defaults equal today's paths, that an env-file value
        # is parsed and never executed, that every refused value is refused,
        # and that every isolation case is refused.
        run: bash scripts/test-hybrid-ai-env.sh

      - name: Readability probe tests
        # Offline. Proves the open(2)-based readability probe used in system
        # mode succeeds where access(2)-based `[[ -r ]]`/`find -readable` would
        # misreport a CAP_DAC_READ_SEARCH-readable file as unreadable.
        run: bash scripts/test-read-probe.sh

      - name: Backup system-unit static tests
        # Offline. Asserts every directive of the privilege split: the capture
        # unit's capability and no-network/no-credential shape, the upload
        # unit's credentials and no-read-privilege shape, and the fixed
        # schedules. Also runs systemd-analyze verify, skipping only when every
        # diagnostic is the missing-host-path form.
        run: bash scripts/test-backup-system-units.sh

      - name: Backup mode / timer tests
        # Offline. Proves HYBRID_AI_BACKUP_MODE steers doctor.sh,
        # collect-diagnostics.sh, scripts/deploy-remote.sh and backup.sh to the
        # right timer and systemctl scope in both modes.
        run: bash scripts/test-backup-mode-timers.sh

      - name: Backup container-control helper tests
        # Offline. Proves backup/backup-containers.sh is root-only, uses a fixed
        # container list, writes only under /run/hybrid-ai-backup, is idempotent
        # on unpause and never starts or stops a container.
        run: bash scripts/test-backup-containers.sh

      - name: Doctor backup-probe tests
        # Offline, grep-level. Proves doctor.sh's repository probe exports
        # RESTIC_PASSWORD_FILE, resolves repo-password with backup.sh's
        # CREDENTIALS_DIRECTORY precedence, and never invokes restic before the
        # export, so the probe no longer warns "Could not reach the backup
        # repository" on a host whose repository opens fine.
        run: bash scripts/test-doctor-backup-probe.sh

      - name: Doctor startup-grace tests
        # Offline. RUNS doctor.sh (stubbed docker/curl/jq/getfacl, fixture JSON on
        # disk) to prove the new warning-only startup-grace check: a healthy
        # fixture passes, an in-window ERROR row warns with the remedy and exits 1
        # (never 2), an unreachable app-server prints a skip note and leaves the
        # exit code as the healthy run does, and the ERROR row on page 2 proves the
        # pager is followed. The harness fails against a doctor.sh without the
        # check.
        run: bash scripts/test-doctor-startup-grace.sh

      - name: Doctor post-deploy-log tests
        # Offline. RUNS doctor.sh (stubbed host commands, fixture log files) to
        # prove the new warning-only post-deploy verification-log check: a fresh
        # non-empty log passes at the base exit code, a 0-byte log warns and exits
        # 1 (never 2), a log older than the deployed HEAD's commit warns, and an
        # absent or unreadable log or git tree prints a skip note and leaves the
        # exit code alone. The harness fails against a doctor.sh without the
        # check.
        run: bash scripts/test-doctor-post-deploy-log.sh

      - name: Doctor RunPod key tests
        # Offline. RUNS doctor.sh (stubbed curl/getent/tailscale/docker and
        # fixture .env files) to prove two things. A GPU pod that is merely
        # asleep no longer fails the deploy gate: a well-formed
        # <pod>.<tailnet>.ts.net name that does not resolve warns (exit 1) and
        # never exits 2, while a bare suffix, a single label and a foreign
        # domain still fail naming the expected pod MagicDNS shape. And
        # RUNPOD_API_KEY is validated with ONE read-only RunPod GraphQL query:
        # a valid key passes reporting desiredStatus (a STOPPED pod is a pass),
        # a 401 or a GraphQL auth error fails, and a timeout, a 5xx or a
        # malformed body prints a skip note and leaves the exit code alone.
        # Asserts the query is never a mutation and that the key stays out of
        # curl's argv and out of the report. The harness fails against a
        # doctor.sh without these checks.
        run: bash scripts/test-doctor-runpod-key.sh

      - name: Status deploy-verification tile tests
        # Offline, no Docker, no network. Proves status/app.py's Deploy
        # verification tile parses the LAST `waiting for <sha> at <ts>` line and
        # the verdict after it: PASS -> ok naming the short sha and timestamp,
        # FAIL/TIMEOUT -> fail quoting the verdict, an earlier verdict is never
        # carried into a later block, and an absent, empty, directory-shaped,
        # unreadable, unparseable or still-running log degrades to warn with a
        # clear detail rather than a crash. A credential-shaped verdict detail
        # is redacted before display. Fixture files in a scratch dir; the probe
        # path is set through POST_DEPLOY_VERIFY_LOG_PATH. The harness fails
        # against a status/app.py without the probe.
        run: python3 status/test_deploy_verification.py

      - name: GPU pod wake-readiness tile tests
        # Offline, no Docker, no network. Proves status/app.py's GPU pod tile
        # reports WAKE READINESS, not pod reachability: an unresolved MagicDNS
        # name (a stopped pod, normal most of the time) is info when a RunPod
        # API key is configured and warn when none is, and is never fail. The
        # out-of-mesh address stays fail. socket.getaddrinfo is stubbed and the
        # env set per case, with a fresh module import each time so each case
        # exercises its own env. The harness fails against the unpatched app.py,
        # which returned fail for a stopped pod.
        run: python3 status/test_pod_probe.py

      - name: Doctor resolv.conf ownership tests
        # Offline. RUNS doctor.sh (stubbed tailscale/docker/systemctl and
        # fixture resolv.conf files, named through the internal
        # DOCTOR_RESOLV_CONF seam) to prove the new warn-only resolv.conf
        # ownership note. On the Pi tailscaled writes /etc/resolv.conf itself
        # (direct-file mode), because neither systemd-resolved nor resolvconf
        # runs there; its "System DNS config not ideal. /etc/resolv.conf
        # overwritten." health line is that mode announcing itself and is
        # expected-benign. The expected state (health line + tailscaled header)
        # prints an informational note, moves no summary count and leaves the
        # exit code at the check-free baseline. A FOREIGN owner (health line
        # present, header absent) warns naming the changed ownership and exits
        # 1 -- never 2. An unreachable daemon and an absent tailscale CLI each
        # print a skip note and leave every count and the exit code as the
        # baseline had them. Only the header line is matched: the fixture's
        # nameserver literal never reaches the report. The harness fails
        # against a doctor.sh without the check.
        run: bash scripts/test-doctor-resolv-conf.sh

      - name: Doctor backup-count tests
        # Offline. RUNS doctor.sh (stubbed host commands, fixture backup logs)
        # to prove the failure count is DISTINCT run(s), not lines: one failed
        # run writes TWO event=backup_failed lines (die() plus the ERR trap),
        # so three runs (six lines) must warn "3 backup failure(s)", not 6, and
        # the last event=backup_success still resets the count.
        # event=check_failed lines count the same way. The harness fails against
        # a doctor.sh that counts lines.
        run: bash scripts/test-doctor-backup-counts.sh

      - name: Doctor sandbox-firewall tests
        # Offline. RUNS doctor.sh (stubbed iptables and a recorded DOCKER-USER
        # chain) to prove the new warning-only sandbox-firewall check: a chain
        # applied by the REAL scripts/sandbox-firewall.sh passes, a missing rule
        # (all three, or only the webhook ACCEPT) warns naming it and exits 1
        # (never 2), and no iptables / an unreadable chain / an empty listing /
        # a non-Linux host each print a skip note and leave every summary count
        # as the baseline had it. The harness fails against a doctor.sh without
        # the check.
        run: bash scripts/test-doctor-sandbox-firewall.sh

      - name: Doctor sandbox-image tests
        # Offline. RUNS doctor.sh (a fixture-driven docker stub on PATH) to prove
        # the new warning-only sandbox-image drift probe: the app-server's
        # AGENT_SERVER_IMAGE_* pair is compared with the resolved pin, and every
        # live oh-agent-server container's real image is compared with that same
        # repository:tag. A fully hybrid stack passes at the probe-free baseline
        # exit code; a stock sandbox image warns naming the container and warns
        # that the app-server build may not honour the override, exit 1, never 2;
        # a stock or half or absent env pair warns naming BOTH seen values, exit
        # 1; and no docker, an erroring docker, an absent app-server container or
        # an unreadable sandbox image each print a skip note and leave every
        # summary count as the baseline had it. The harness fails against a
        # doctor.sh without the probe.
        run: bash scripts/test-doctor-sandbox-image.sh

      - name: Sandbox firewall tests
        # Offline. RUNS scripts/sandbox-firewall.sh against stubbed docker and
        # iptables to prove the bridge-scoped rule set: the stateful conntrack
        # ACCEPT above every owned DROP, app->sandbox control ports and
        # sandbox->app tcp/3000 per app bridge resolved from `docker network
        # inspect`, one stack DROP per bridge, LAN/tailnet destination DROPs,
        # no dead pre-DNAT 3001 rule and no blanket `! -o docker0`, idempotency,
        # foreign rules preserved, an unresolvable network warned about and
        # still exit 0, and the ordering self-check failing loudly.
        run: bash scripts/test-sandbox-firewall.sh

      - name: Deploy-remote tests
        # Offline. Proves scripts/deploy-remote.sh refuses a wrong revision
        # before running install.sh, and maps doctor.sh's exit code correctly.
        run: bash scripts/test-deploy-remote.sh

      - name: Post-deploy verifier tests
        # Offline. Proves scripts/run-post-deploy-verify.sh resolves APP_DIR from
        # the environment, then the layout file, then /workspace, and that the
        # tree check verdicts PASS / FAIL against a throwaway checkout.
        run: bash scripts/test-run-post-deploy-verify.sh

      - name: Headless deploy forced-command tests
        # Offline. Proves the forced-command entrypoint accepts only
        # `deploy <40-lowercase-hex>`, refuses every other form with exit 2 and
        # nothing run, uses the SYSTEM manager, gives a non-zero exit on unit
        # failure, prints the run log, and that the polkit rule grants only
        # that one user, action, verb and unit shape. systemctl is stubbed.
        run: bash scripts/test-deploy-forced-command.sh

      - name: Headless deploy instance tests
        # Offline. Proves scripts/deploy-instance.sh re-validates the sha, takes
        # the lock, refuses a credential-bearing origin, fetches the public
        # https remote with hooks disabled, refuses a non-ancestor sha and a
        # HEAD mismatch, writes the run log mode 0640, and that the unit has no
        # Restart= line. git and deploy-remote.sh are stubbed.
        run: bash scripts/test-deploy-instance.sh

      - name: Headless deploy trigger tests
        # Offline. Proves scripts/deploy-trigger.sh sends exactly one command
        # string (`deploy <sha>`) to the literal `hybrid-ai-deploy` account,
        # refuses a malformed sha without invoking ssh, refuses a host-key
        # fingerprint mismatch before authenticating, maps the remote exit
        # codes 0/2/3/255, removes the temporary private key on success and
        # failure, and never uses StrictHostKeyChecking=no or accept-new.
        # ssh, ssh-keyscan and ssh-keygen are stubbed on PATH.
        run: bash scripts/test-deploy-trigger.sh

      - name: Deploy image gate tests
        # Offline, with no root, network or Docker. Proves
        # scripts/deploy-image-gate.sh resolves the pin from install.sh's STEP 8
        # defaults, probes the GHCR manifest anonymously, exits 0 on HTTP 200,
        # retries on 404, times out non-zero, and FAILS CLOSED on an unexpected
        # HTTP status or a transport error rather than proceeding. curl is
        # stubbed on PATH; retry/timeout are squeezed to seconds. The harness
        # fails against a tree without scripts/deploy-image-gate.sh.
        run: bash scripts/test-deploy-image-gate.sh

      - name: Host bootstrap / migration tests
        # Offline, with no root, Docker or network. Proves scripts/bootstrap.sh
        # refuses a non-root caller and every bad input with its own exit code,
        # creates the three system accounts and the FHS layout idempotently,
        # writes a secret-free layout env file, installs the (never enabled)
        # deploy unit and polkit rule, and migrates a legacy fixture with moves
        # that preserve inodes. useradd, getent, systemctl, docker, git, sshd and
        # polkit are stubbed; HYBRID_AI_BOOTSTRAP_ROOT points at a scratch tree.
        run: bash scripts/test-bootstrap.sh

      - name: Install health-gate tests
        # Offline. Proves install.sh exits non-zero and withholds install_success
        # when the hermes-agent health wait fails, so the bootstrap's hand-off
        # cannot cut over an unhealthy Hermes. Docker, curl and friends are
        # stubbed on PATH; the Hermes wait window is asserted at 300 s.
        run: bash scripts/test-install-health.sh

      - name: Deploy wiring install tests
        # Offline, no root, no Docker, no network. Proves install.sh re-applies
        # deploy/hybrid-ai-deploy@.service and deploy/50-hybrid-ai-deploy.rules
        # on every deploy (including --no-start), so a fix to either file
        # reaches an already-bootstrapped host through the normal deploy. A
        # stale 20-min unit is replaced by the tree content; the unit is never
        # enabled or started; non-root and no-systemctl runs only warn and
        # leave install.sh's exit status unchanged. systemctl is stubbed on
        # PATH and the unit/polkit dirs are scratch directories.
        run: bash scripts/test-deploy-wiring-install.sh

      - name: Conversation prune lease-guard tests
        # Offline, no root, no Docker, no network. RUNS
        # scripts/prune-conversations.sh against throwaway fixture trees under
        # mktemp -d to prove the lease guard in BOTH directions: a live lease
        # keeps a directory, an expired lease past grace with an old mtime
        # moves it into quarantine with its files intact, a recent directory
        # is kept, a missing lease is kept (refused lease-missing), a symlink
        # is refused and not followed, the per-run move cap is honoured, a
        # second run moves nothing, and the quarantine never escapes the
        # workspace. The harness fails against a tree without the script.
        run: bash scripts/test-prune-conversations.sh

      - name: Doctor lease-less conversation tests
        # Offline, no root, no Docker, no network. RUNS doctor.sh against
        # fixture conversation trees to prove the lease-less check in BOTH
        # directions: a lease-complete root passes, a root with lease-less
        # directories warns with the count and names
        # HYBRID_AI_PRUNE_ALLOW_LEASE_LESS plus the prune unit and script,
        # an absent or unreadable root prints a skip note and leaves the exit
        # code alone. The check is warning-only, so every case asserts the
        # exit code is never 2. The harness fails against a doctor.sh without
        # the check (verified against the base commit's copy).
        run: bash scripts/test-doctor-lease-less.sh

      - name: Docker build-cache prune tests
        # Offline, no root, no Docker, no network. Proves
        # scripts/prune-docker-cache.sh caps the build cache and degrades
        # safely: docker absent -> exit 0, daemon down -> exit 0, success ->
        # the probed cap flag and cap reach the docker argv, the
        # HYBRID_AI_BUILD_CACHE_CAP override is honoured, a --keep-storage-only
        # Docker falls back, prune failure -> exit 1, and no supported flag ->
        # exit 0 without invoking prune. docker/df/date are stubbed on PATH.
        # Also greps the unit files for their key lines and proves install.sh
        # writes the 15GB default and preserves an owner value across a re-run.
        run: bash scripts/test-prune-docker-cache.sh

      - name: Uninstall teardown tests
        # Offline, no root, no Docker, no network. Proves scripts/uninstall.sh
        # removes the right things and nothing else: a full install invokes the
        # compose `down --remove-orphans` with the three -f files (exact argv),
        # a remnants-only host removes the six containers by name with NO
        # compose call, an empty host is a no-op that exits 0, --remove-data
        # removes the fixture data while the default keeps it, an
        # out-of-allowlist layout value is refused and left untouched, a mixed
        # DOCKER-USER chain loses only its tagged rules (never a flush or a
        # chain delete), a hybrid-ai-* glob unit is removed, and --dry-run
        # mutates nothing. docker, systemctl, runuser, iptables, getent and id
        # are stubbed on PATH; HYBRID_AI_UNINSTALL_ROOT points at a scratch tree.
        run: bash scripts/test-uninstall.sh

      - name: Env pin migration tests
        # Offline. Proves install.sh's STEP 2b migration moves a stale
        # :1.8 / 1.26.0-python pin in an existing .env to the current defaults,
        # preserves an owner-chosen pin untouched, writes the new defaults when
        # no .env exists, and is idempotent on a second run. Docker and friends
        # are stubbed on PATH; the run uses --no-start.
        run: bash scripts/test-env-pin-migration.sh

      - name: Post-deploy verify-log env tests
        # Offline. Proves install.sh's STEP 8 template writes
        # HYBRID_AI_POST_DEPLOY_VERIFY_LOG as ${VAR:-default}: with nothing set
        # it writes the default path; an owner override loaded from the existing
        # .env survives the rewrite byte-for-byte; a second run changes nothing.
        # Docker and friends are stubbed on PATH; the run uses --no-start. The
        # harness fails against an install.sh without the template line.
        run: bash scripts/test-post-deploy-verify-log-env.sh

      - name: Status backup-log env tests
        # Offline. Proves install.sh's STEP 8 template writes the RESOLVED
        # BACKUP_LOG that docker-compose.yml now uses as the status service's
        # backup-log mount source: user mode yields <log dir>/backup.log (the
        # path the old compose expression rendered), system mode yields the
        # units' LogsDirectory= path, and an owner override survives reruns
        # byte-for-byte. Without the template line the mount would point at a
        # file nothing writes on system-mode hosts.
        # It also proves the second half of that contract: BACKUP_GROUP_GID is
        # the hybrid-ai-backup group's gid in system mode (resolved BY NAME),
        # the container's own primary gid in user mode, an owner override
        # survives reruns, a missing group is fatal, and STEP 7 repairs an
        # existing log to 0640 owned by hybrid-ai-backup.
        # Docker and friends are stubbed on PATH; the run uses --no-start.
        run: bash scripts/test-status-backup-log-env.sh

      - name: Status backup-log probe tests
        # Offline. Pins the reader half of the contract in status/app.py:
        # absent, unreadable and empty are three DISTINCT warn messages (the
        # unreadable one names permission denied, the reader's uid and the
        # file's owner uid:gid), a log with no success line says so, a 0640
        # group-readable log parses, and a recent success shows as ok in both
        # the Backups and Jobs tiles. No Docker, no network: fixture log files
        # only. The unreadable case is a REAL permission failure; a root run
        # drops privileges in a forked child and prints SKIP if it cannot, so
        # SKIP is visible here as a failure, never a silent pass.
        run: bash scripts/test-status-backup-probe.sh

      - name: Agent-server image repository tests
        # Offline. Proves install.sh's STEP 2b migration moves the canonical
        # ghcr.io/openhands/agent-server repository in an existing .env to the
        # CDN default that does not trigger the app server's silent re-pin,
        # preserves an owner-chosen repository untouched, writes the new default
        # when no .env exists, and is idempotent on a second run. Docker and
        # friends are stubbed on PATH; the run uses --no-start.
        run: bash scripts/test-agent-image-repo-migration.sh

      - name: Tailscale address retirement tests
        # Offline. Proves install.sh's STEP 2b retirement of the stored
        # TAILSCALE_IP: a legacy value that matches the address RUNPOD_HOST
        # resolves to today is dropped and the MagicDNS name takes over; any
        # other value is preserved byte-for-byte under a comment saying nothing
        # reads it; a fresh .env writes RUNPOD_HOST; a second run changes
        # nothing. tailscale and getent are stubbed on PATH; the run uses
        # --no-start.
        run: bash scripts/test-install-tailscale-migration.sh

      - name: Agent-server hybrid cutover tests
        # Offline. Proves install.sh's STEP 2b pair-exact migration cuts a
        # previously deployed host over from the OLD default pair
        # (docker.openhands.dev/openhands/agent-server AND 1.37.1-python) to the
        # derived hybrid defaults, preserves an owner-chosen repository and/or
        # tag untouched (a partial match leaves BOTH alone and logs it), writes
        # the new defaults when no .env exists, and is idempotent on a second
        # run. Docker and friends are stubbed on PATH; the run uses --no-start.
        run: bash scripts/test-agent-image-hybrid-cutover.sh

      - name: Secret-guard hook tests
        # Offline. Proves hermes/agent-hooks/secret-guard.py blocks secret-file
        # arguments, environment dumps and secret-harvest shell commands,
        # allows a benign payload, and FAILS CLOSED (exit 2) on unrecognised
        # state -- malformed JSON, non-object JSON, empty stdin, a foreign
        # hook_event_name, a missing tool_name and a non-dict tool_input. The
        # baseline exited 1 on an unparseable payload, which allowed the call.
        # Also proves install.sh's STEP 9a-3 installs the guard 0755 into every
        # profile, declares it exactly once without dropping a peer hook, and is
        # idempotent on a second run. hermes is stubbed on PATH; profiles are
        # fixture directories under a mktemp tree.
        run: bash scripts/test-secret-guard.sh

      - name: TLS compose render tests
        # Offline. Renders the TLS-off and TLS-on compose/Caddyfile variants in
        # a throwaway tree. Beyond the existing byte-identity, allowlist and
        # hardening checks, it asserts the TLS-on render's proxy `build:`
        # context (./caddy) exists with its Dockerfile: that context was
        # specified in docs/tls-acme-design.md but never committed, so
        # `docker compose build proxy` failed on the first TLS enablement.
        run: bash scripts/test-tls-installer-render.sh

      - name: TLS Caddyfile validation tests
        # Offline; docker and caddy are stubbed as shell functions. Proves
        # tls_validate_caddyfile hands the validator the same runtime values
        # the proxy's compose `environment:` block supplies (ACME_EMAIL,
        # TLS_DOMAIN, ACME_CA, ACME_AUTO_HTTPS, LOCAL_DOMAIN) on BOTH the
        # docker and host-binary branches, keeps --network none and the :ro
        # mount, keeps the skip contract (exit 3), and that ACME_CA input is
        # normalized to the resolved URL at the single tls_validate_settings
        # seam. It does NOT run a real `caddy validate`: the runners have no
        # Caddy and no Docker.
        run: bash scripts/test-tls-caddy-validation.sh

      - name: TLS check harness tests
        # Offline/loopback: a throwaway openssl CA and `openssl s_server` on
        # [IP_ADDRESS], no Docker, no root, no network. Runs the REAL
        # scripts/tls-check.sh against real handshakes, including that a
        # wildcard SAN covers exactly one label (not the apex, not two labels).
        run: bash scripts/test-tls-check.sh

      - name: Auth render tests
        # Offline. Renders the managed Caddyfile template in a throwaway tree
        # with AUTH_ENABLED off and on. Proves the login gate is emitted ONLY
        # when AUTH_ENABLED=on: the off render is byte-identical to the tracked
        # status/Caddyfile with zero basic_auth hits; the on render defines the
        # (auth) snippet once with the two env placeholders and imports it into
        # exactly the 9 gated blocks (every apex HTTPS handle except
        # handle /health, plus the hermes./status./wildcard site level), never
        # into a http:// jarvis.lan site or the redirect block. Also proves the
        # fail-closed path: AUTH_ENABLED=on with an empty user or hash renders a
        # basic_auth block the validator rejects. Needs no Docker or Caddy.
        run: bash scripts/test-auth-render.sh

      - name: Validate rendered Caddyfiles with real Caddy (TLS x auth matrix)
        # The only guard that runs a REAL Caddy over the RENDERED file: every
        # other suite stubs `caddy` textually, so none of them can catch a
        # snippet that is imported but never defined. It renders each supported
        # flag combination and lets the proxy's own image adapt the result:
        #   (a) TLS off                    -> variants `off`
        #   (b) TLS on, AUTH_ENABLED=off   -> variants `on dns` (the default)
        #   (c) TLS on, AUTH_ENABLED=on    -> variants `on dns auth`
        #   (d) TLS off, AUTH_ENABLED=on   -> variants `off`, byte-identical to
        #       case (a). The (auth) snippet is imported only by the HTTPS
        #       sites, so with TLS off there are no sites to import it and it is
        #       dead config: real Caddy rejects the render with `parsed
        #       'basic_auth' as a site address, but it is a known directive`.
        #       Case (d) derives its variants from tls_variants, so an unpatched
        #       tls_variants that renders `off auth` fails here.
        # A dangling `import auth` (case b before the template gated the imports
        # by the auth variant) fails here with `File to import not found: auth`.
        # Placeholder credentials only; the DNS credential is passed by PATH
        # name, never by value.
        run: |
          set -Eeuo pipefail
          source scripts/lib/hybrid-ai-env.sh
          hybrid_ai_env_load
          source scripts/lib/tls.sh

          WORK="$(mktemp -d)"
          trap 'rm -rf -- "$WORK"' EXIT

          # Real Caddy provisions the TLS app during validate, and the rendered
          # dns-01 config reads its token from /run/secrets/... by design. The
          # file must exist and be non-empty or provisioning fails before the
          # config is judged ("API token '' appears invalid"), which would hide
          # every other problem behind a missing credential. Mount an obviously
          # fake token -- it is the value of nothing and reaches no network
          # (--network none).
          printf '%s\n' 'dummy-cloudflare-token-for-ci-only-not-a-secret' > "$WORK/dummy_dns_token"

          docker build -t hybrid-ai-caddy:ci ./caddy

          LOCAL_DOMAIN="jarvis.lan"
          TLS_DOMAIN="daemonhub.dev"
          ACME_EMAIL="ci@daemonhub.dev"
          ACME_CA="$TLS_CA_STAGING_URL"
          HYBRID_AI_TLS_TOKEN_FILE="/run/secrets/cloudflare_dns_token"
          TLS_VALIDATION="dns"
          ACME_DNS_PROVIDER="cloudflare"
          # Non-secret placeholders: an obviously fake user name and a
          # bcrypt-SHAPED string that is not the hash of anything. The hash is
          # assembled at run time from fragments so the tracked source never
          # contains a bcrypt-hash literal (Semgrep flags those as secrets,
          # even fake ones). The result is still the shape Caddy expects:
          # $2a$<cost>$<22-char salt><31-char digest> = 60 characters.
          DUMMY_AUTH_USER='DUMMY_AUTH_USER_NOT_A_SECRET'
          DUMMY_BCRYPT_MARK='$'"2a"'$'
          DUMMY_BCRYPT_COST='14'
          DUMMY_BCRYPT_SALT='./ABCDEFGH./ABCDEFGH./'
          DUMMY_BCRYPT_DIGEST='ABCDEFGH./ABCDEFGH./ABCDEFGH./A'
          DUMMY_AUTH_HASH="${DUMMY_BCRYPT_MARK}${DUMMY_BCRYPT_COST}\$${DUMMY_BCRYPT_SALT}${DUMMY_BCRYPT_DIGEST}"
          if [[ "${#DUMMY_AUTH_HASH}" -ne 60 ]]; then
            echo "fixture bug: dummy bcrypt value is ${#DUMMY_AUTH_HASH} chars, expected 60" >&2
            exit 1
          fi

          check_case() {  # NAME VARIANTS|auto
            local name="$1" variants="$2" out="$WORK/$1.Caddyfile"
            local imports snippets
            # "auto" derives the variants from the live tls_variants(), so the
            # assertion tracks the production selection rather than a literal:
            # an unpatched tls_variants that appends `auth` with TLS off makes
            # case (d) render `off auth` and fail the byte-identical check.
            if [[ "$variants" == auto ]]; then
              variants="$(tls_variants)"
            fi
            tls_prepare_render_values "$variants"
            tls_render_to_file "${HYBRID_AI_APP_DIR}/status/Caddyfile.tmpl" "$variants" "$out"
            imports="$(grep -c 'import auth' "$out" || true)"
            snippets="$(grep -c '^(auth) {' "$out" || true)"
            echo "case ${name} (variants: ${variants}): ${imports} 'import auth' lines, ${snippets} '(auth)' definitions"
            docker run --rm --network none --entrypoint caddy \
              -e TLS_DOMAIN="$TLS_DOMAIN" \
              -e ACME_EMAIL="$ACME_EMAIL" \
              -e ACME_CA="$ACME_CA" \
              -e LOCAL_DOMAIN="$LOCAL_DOMAIN" \
              -e ACME_AUTO_HTTPS=disable_redirects \
              -e HYBRID_AI_AUTH_USER="$HYBRID_AI_AUTH_USER" \
              -e HYBRID_AI_AUTH_HASH="$HYBRID_AI_AUTH_HASH" \
              -v "${out}:/etc/caddy/Caddyfile:ro" \
              -v "$WORK/dummy_dns_token:/run/secrets/cloudflare_dns_token:ro" \
              hybrid-ai-caddy:ci validate --adapter caddyfile --config /etc/caddy/Caddyfile
            echo "case ${name}: accepted by caddy"
          }

          TLS_ENABLED="no"
          AUTH_ENABLED="off"
          HYBRID_AI_AUTH_USER=""
          HYBRID_AI_AUTH_HASH=""
          check_case tls_off "off"

          TLS_ENABLED="yes"
          check_case tls_on_auth_off "on dns"

          AUTH_ENABLED="on"
          HYBRID_AI_AUTH_USER="$DUMMY_AUTH_USER"
          HYBRID_AI_AUTH_HASH="$DUMMY_AUTH_HASH"
          check_case tls_on_auth_on "on dns auth"

          # (d) AUTH_ENABLED truthy + TLS off. The variants must be exactly
          # "off" (suppress, not repair), the render must be BYTE-IDENTICAL to
          # case (a)'s auth-off render, and real Caddy must accept it. Derived
          # from tls_variants, so an unpatched tls_variants ("off auth") fails
          # the "exactly off" and byte-identical assertions before Caddy runs.
          TLS_ENABLED="no"
          AUTH_ENABLED="on"
          HYBRID_AI_AUTH_USER="$DUMMY_AUTH_USER"
          HYBRID_AI_AUTH_HASH="$DUMMY_AUTH_HASH"
          case_d_variants="$(tls_variants)"
          if [[ "$case_d_variants" != "off" ]]; then
            echo "::error::case (d) tls_variants is '${case_d_variants}', expected exactly 'off' with TLS off"
            exit 1
          fi
          check_case tls_off_auth_on auto
          if ! cmp -s -- "$WORK/tls_off.Caddyfile" "$WORK/tls_off_auth_on.Caddyfile"; then
            echo "::error::case (d) render is not byte-identical to case (a) auth-off render"
            diff -u "$WORK/tls_off.Caddyfile" "$WORK/tls_off_auth_on.Caddyfile" || true
            exit 1
          fi
          echo "case (d) render is byte-identical to case (a)"

      - name: Compose schema check
        # Dummy values just so the file can be parsed. "config --quiet"
        # validates structure without starting anything. HYBRID_AI_DATA_DIR and
        # HYBRID_AI_LOG_DIR must be set because the compose bind sources are
        # fail-closed (`:?`), so an unset value refuses the parse. The bind
        # sources are rendered below with the path settings set to a temp tree,
        # and a parse with them unset is asserted to fail closed.
        run: |
          set -a
          RUNPOD_HOST=runpod-worker.example.test RUNPOD_API_KEY=x \
          RUNPOD_POD_ID=x WEBUI_SECRET_KEY=x STATUS_UID=1000 DOCKER_GID=999 \
          OLLAMA_MEM_LIMIT=8g WEBUI_MEM_LIMIT=3g OLLAMA_CPUS=3.5 WEBUI_CPUS=2.0 \
          LOCAL_DOMAIN=example.test OPENHANDS_SANDBOX_HOST=example.test \
          OPENHANDS_WORKSPACE=/tmp/agent-workspace \
          OPENHANDS_STATE_DIR=/tmp/openhands-state \
          HYBRID_AI_DATA_DIR=/tmp/agent-data \
          HYBRID_AI_LOG_DIR=/tmp/agent-log \
          BACKUP_LOG=/tmp/agent-log/backup.log \
          BACKUP_GROUP_GID=999
          set +a
          docker compose -f docker-compose.yml config --quiet
          # The overlays are deployed on every install but were never validated
          # here, so a broken overlay reached the Pi before anything caught it.
          # The Hermes overlay references the shared `coder-net` defined in
          # docker-compose.yml, so it must be validated with all three files.
          docker compose -f docker-compose.yml \
                         -f openhands/docker-compose.openhands.yml \
                         -f hermes/docker-compose.hermes.yml \
                         config --quiet

          # --- Unset: compose fails closed ------------------------------------
          # With HYBRID_AI_DATA_DIR and HYBRID_AI_LOG_DIR unset the three-file
          # parse must be refused (non-zero) and name ./install.sh, so nobody
          # starts the stack with silently-wrong bind sources. BACKUP_LOG is a
          # separate fail-closed bind (the status backup-log mount), so it is
          # asserted unset on its own below.
          set +e
          FAILCLOSED_OUT="$(env -u HYBRID_AI_DATA_DIR -u HYBRID_AI_LOG_DIR -u BACKUP_LOG \
            -u BACKUP_GROUP_GID \
            docker compose -f docker-compose.yml \
                           -f openhands/docker-compose.openhands.yml \
                           -f hermes/docker-compose.hermes.yml config 2>&1 >/dev/null)"
          FAILCLOSED_RC=$?
          set -e
          [ "$FAILCLOSED_RC" -ne 0 ] \
            || { echo "::error::unset HYBRID_AI_DATA_DIR/HYBRID_AI_LOG_DIR did not fail closed"; exit 1; }
          printf '%s\n' "$FAILCLOSED_OUT" | grep -q './install.sh' \
            || { echo "::error::fail-closed compose error did not name ./install.sh"; exit 1; }

          # BACKUP_LOG unset, everything else set: the status backup-log mount
          # must still refuse the parse and name ./install.sh. This is the
          # mount that decides whether `Backup: ok` can ever appear.
          set +e
          BACKUP_FAILCLOSED_OUT="$(env -u BACKUP_LOG \
            docker compose -f docker-compose.yml \
                           -f openhands/docker-compose.openhands.yml \
                           -f hermes/docker-compose.hermes.yml config 2>&1 >/dev/null)"
          BACKUP_FAILCLOSED_RC=$?
          set -e
          [ "$BACKUP_FAILCLOSED_RC" -ne 0 ] \
            || { echo "::error::unset BACKUP_LOG did not fail closed"; exit 1; }
          printf '%s\n' "$BACKUP_FAILCLOSED_OUT" | grep -q './install.sh' \
            || { echo "::error::BACKUP_LOG fail-closed compose error did not name ./install.sh"; exit 1; }

          # BACKUP_GROUP_GID unset, everything else set: without it the status
          # container loses its only supplementary group and the Backups tile
          # goes blind, so the parse must be refused here too.
          set +e
          GROUP_FAILCLOSED_OUT="$(env -u BACKUP_GROUP_GID \
            docker compose -f docker-compose.yml \
                           -f openhands/docker-compose.openhands.yml \
                           -f hermes/docker-compose.hermes.yml config 2>&1 >/dev/null)"
          GROUP_FAILCLOSED_RC=$?
          set -e
          [ "$GROUP_FAILCLOSED_RC" -ne 0 ] \
            || { echo "::error::unset BACKUP_GROUP_GID did not fail closed"; exit 1; }
          printf '%s\n' "$GROUP_FAILCLOSED_OUT" | grep -q './install.sh' \
            || { echo "::error::BACKUP_GROUP_GID fail-closed compose error did not name ./install.sh"; exit 1; }
          echo "Compose refuses to parse with the data/log dirs, BACKUP_LOG or BACKUP_GROUP_GID unset."

          # --- Set to a temp tree: bind sources move under it -----------------
          TMPTREE="$(mktemp -d)"
          export HYBRID_AI_DATA_DIR="$TMPTREE/data" HYBRID_AI_LOG_DIR="$TMPTREE/log"
          export BACKUP_LOG="$TMPTREE/log/backup.log"
          RENDER_SET="$(docker compose -f docker-compose.yml \
                                       -f openhands/docker-compose.openhands.yml \
                                       -f hermes/docker-compose.hermes.yml config)"
          printf '%s\n' "$RENDER_SET" | grep -q "source: $TMPTREE/data/hermes_data" \
            || { echo "::error::HYBRID_AI_DATA_DIR was not honoured"; exit 1; }
          printf '%s\n' "$RENDER_SET" | grep -q "source: $TMPTREE/data/webui_data" \
            || { echo "::error::HYBRID_AI_DATA_DIR was not honoured"; exit 1; }
          printf '%s\n' "$RENDER_SET" | grep -q "source: $BACKUP_LOG" \
            || { echo "::error::BACKUP_LOG was not honoured for the status mount"; exit 1; }
          # The status service carries exactly one supplementary group built
          # from BACKUP_GROUP_GID=999.
          [ "$(printf '%s\n' "$RENDER_SET" | grep -c 'group_add')" -eq 1 ] \
            || { echo "::error::the status service must declare exactly one group_add"; exit 1; }
          printf '%s\n' "$RENDER_SET" | grep -A3 'group_add' | grep -q '999' \
            || { echo "::error::the rendered supplementary group is not BACKUP_GROUP_GID=999"; exit 1; }
          rm -rf "$TMPTREE"
          echo "Compose renders under a split layout."

          # --- system mode: the helper's value IS the status mount source -----
          # The regression this guards against: compose used to mount
          # ${HYBRID_AI_LOG_DIR}/backup.log, a file nothing writes in system
          # mode, so the status page could never report a successful backup.
          # Resolve BACKUP_LOG through the shared helper exactly as install.sh
          # does, then prove the status service mounts THAT path.
          export HYBRID_AI_LOG_DIR="$(mktemp -d)/log"
          SYS_BACKUP_LOG="$(env -u BACKUP_LOG HYBRID_AI_BACKUP_MODE=system \
            HYBRID_AI_LOG_DIR="$HYBRID_AI_LOG_DIR" \
            bash -c 'source scripts/lib/hybrid-ai-env.sh; printf "%s" "$BACKUP_LOG"')"
          [ "$SYS_BACKUP_LOG" = "/var/log/hybrid-ai-backup/backup.log" ] \
            || { echo "::error::system mode BACKUP_LOG is not the units' log: $SYS_BACKUP_LOG"; exit 1; }
          RENDER_SYS="$(env BACKUP_LOG="$SYS_BACKUP_LOG" HYBRID_AI_BACKUP_MODE=system \
            docker compose -f docker-compose.yml \
                           -f openhands/docker-compose.openhands.yml \
                           -f hermes/docker-compose.hermes.yml config)"
          printf '%s\n' "$RENDER_SYS" | grep -q "source: $SYS_BACKUP_LOG" \
            || { echo "::error::system mode status mount does not read $SYS_BACKUP_LOG"; exit 1; }
          echo "System-mode status mount reads the units' log: $SYS_BACKUP_LOG"
          rm -rf "$(dirname "$HYBRID_AI_LOG_DIR")"

      - name: Validate status/Caddyfile parses
        # The allowlist assertion below reads the Caddyfile as text, so it
        # cannot catch a syntax error. Let Caddy itself parse the file with the
        # same image the stack pins.
        run: |
          docker run --rm -e LOCAL_DOMAIN=example.test \
            -v "$PWD/status/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Validate TLS-on render with real Caddy
        # The only guard that would have caught the TLS walls that shipped
        # (walls 1-3): every other suite stubs caddy textually, so a rendered
        # file that real Caddy rejects still passed CI. This renders the DNS-01
        # variant offline, then lets the proxy's own image parse it.
        run: |
          set -Eeuo pipefail
          source scripts/lib/hybrid-ai-env.sh
          hybrid_ai_env_load
          source scripts/lib/tls.sh

          APP_DIR="$(mktemp -d)"
          trap 'rm -rf -- "$APP_DIR"' EXIT
          mkdir -p "$APP_DIR/status"
          # Real Caddy provisions the TLS app during validate, and the dns-01
          # config reads its token from this path. Supply an obviously fake
          # token so a missing credential cannot mask a config defect. The
          # container has no network.
          printf '%s\n' 'dummy-cloudflare-token-for-ci-only-not-a-secret' > "$APP_DIR/dummy_dns_token"
          cp status/Caddyfile.tmpl "$APP_DIR/status/Caddyfile.tmpl"
          cp docker-compose.yml.tmpl "$APP_DIR/docker-compose.yml.tmpl"

          # LOCAL_DOMAIN and TLS_DOMAIN must differ: with TLS on, the template
          # renders both an http://LOCAL_DOMAIN site and an http://TLS_DOMAIN
          # redirect, and identical names make Caddy reject the file as an
          # "ambiguous site definition" before it judges anything else.
          LOCAL_DOMAIN="jarvis.lan"
          TLS_ENABLED="yes"
          TLS_DOMAIN="example.test"
          ACME_EMAIL="[EMAIL]"
          TLS_VALIDATION="dns"
          ACME_DNS_PROVIDER="cloudflare"
          ACME_CA="$TLS_CA_STAGING_URL"
          # Variable NAME only: no token, no token file, no secret.
          HYBRID_AI_TLS_TOKEN_FILE="/run/secrets/cloudflare_dns_token"
          export LOCAL_DOMAIN TLS_DOMAIN ACME_EMAIL ACME_CA

          tls_prepare_render_values "on dns"
          tls_render_to_file "$APP_DIR/status/Caddyfile.tmpl" "on dns" "$APP_DIR/Caddyfile"
          echo "rendered Caddyfile: $(grep -c 'import trusted_only' "$APP_DIR/Caddyfile") 'import trusted_only' lines"

          docker build -t hybrid-ai-caddy:ci ./caddy

          # Pass the same runtime values the proxy's compose environment: block
          # supplies, else the placeholders expand empty and a good file fails.
          docker run --rm --network none --entrypoint caddy \
            -e TLS_DOMAIN="$TLS_DOMAIN" \
            -e ACME_EMAIL="$ACME_EMAIL" \
            -e ACME_CA="$ACME_CA" \
            -e LOCAL_DOMAIN="$LOCAL_DOMAIN" \
            -e ACME_AUTO_HTTPS=disable_redirects \
            -v "$APP_DIR/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$APP_DIR/dummy_dns_token:/run/secrets/cloudflare_dns_token:ro" \
            hybrid-ai-caddy:ci validate --adapter caddyfile --config /etc/caddy/Caddyfile

      - name: Assert proxy allowlist is intact
        # A future edit could remove `import trusted_only` from a sensitive
        # route and silently expose the status page or the unauthenticated
        # Ollama API. This fails the build if that happens. The same pass also
        # requires the friendly /openwebui and /chat aliases to exist and to
        # actually redirect, so a refactor cannot silently drop them again.
        run: |
          python - <<'EOF'
          import re, sys
          cfg = open('status/Caddyfile').read()
          must_protect = {'/hub*', '/status*', '/ollama/*'}
          must_redirect = {'/openwebui*', '/chat*'}
          found = {}
          for m in re.finditer(r'handle(?:_path)?\s+(\S+)\s*\{(.*?)\n\t\}', cfg, re.S):
              found[m.group(1)] = m.group(2)
          missing = [r for r in must_protect if 'trusted_only' not in found.get(r, '')]
          if missing:
              print(f"::error::Routes missing the IP allowlist: {missing}")
              sys.exit(1)
          absent = [r for r in must_redirect if r not in found]
          if absent:
              print(f"::error::Friendly alias routes missing: {absent}")
              sys.exit(1)
          no_redir = [r for r in must_redirect if 'redir' not in found[r]]
          if no_redir:
              print(f"::error::Friendly alias routes do not redirect: {no_redir}")
              sys.exit(1)
          print(f"All sensitive routes protected: {sorted(must_protect)}")
          print(f"All friendly aliases redirect: {sorted(must_redirect)}")
          EOF

      - name: Assert secure_headers coverage
        # The (secure_headers) snippet was dropped once before, taking the
        # uniform response headers and the Server suppression with it. This
        # reads status/Caddyfile as text and fails if the snippet is missing or
        # incomplete, if any site or handle stops importing it (a site-level
        # import alone is bypassed by a matching handle), or if the removed
        # trusted_proxies directive comes back.
        run: |
          python - status/Caddyfile <<'EOF'
          import re, sys

          cfg = open(sys.argv[1]).read()

          def blocks(lines, prefix):
              """Yield (header, body_lines) for blocks whose header line starts
              with `prefix` and sits at that indentation level."""
              indent = '\t' * prefix[1]
              start = prefix[0]
              out = []
              i = 0
              while i < len(lines):
                  if lines[i].startswith(indent + start) and lines[i].rstrip().endswith('{'):
                      j = i + 1
                      while j < len(lines) and not lines[j].startswith(indent + '}'):
                          j += 1
                      out.append((lines[i].strip(), lines[i + 1:j]))
                      i = j + 1
                  else:
                      i += 1
              return out

          lines = cfg.splitlines()

          expected_header = [
              'header {',
              'X-Content-Type-Options nosniff',
              'X-Frame-Options DENY',
              'Referrer-Policy no-referrer',
              '-Server',
              '}',
          ]

          problems = []

          snippets = {h: b for h, b in blocks(lines, ('(', 0))}
          if '(secure_headers) {' not in snippets:
              problems.append('(secure_headers) snippet is missing')
          else:
              body = [ln.strip() for ln in snippets['(secure_headers) {']]
              if body != expected_header:
                  problems.append(
                      '(secure_headers) snippet does not contain exactly the four '
                      f'expected header operations; found: {body!r}')

          if 'trusted_proxies' in cfg:
              problems.append('trusted_proxies must not be present')

          def require(where, body, label, snippet):
              if not any(ln.strip() == f'import {snippet}' for ln in body):
                  problems.append(f'{where} ({label}) is missing import {snippet}')

          sites = blocks(lines, ('http://', 0))
          for name, body in sites:
              if 'status.{$LOCAL_DOMAIN}' in name or 'hermes.{$LOCAL_DOMAIN}' in name:
                  require(name, body, name, 'secure_headers')

          main = [b for h, b in sites if h == 'http://{$LOCAL_DOMAIN} {']
          if not main:
              problems.append('http://{$LOCAL_DOMAIN} site block is missing')
          else:
              handles = blocks(main[0], ('handle', 1))
              wanted = {'/status*', '/hub*', '/health', '/ollama/*',
                        '/openwebui*', '/chat*'}
              seen = set()
              for header, body in handles:
                  m = re.match(r'handle(?:_path)?\s+(\S+)\s*\{', header)
                  label = m.group(1) if m else 'catch-all handle'
                  if m:
                      seen.add(m.group(1))
                  require('http://{$LOCAL_DOMAIN}', body, label, 'secure_headers')
              missing = sorted(wanted - seen)
              if missing:
                  problems.append(f'handles missing from the main site: {missing}')
              if not any(re.match(r'handle\s*\{', h) for h, _ in handles):
                  problems.append('catch-all handle is missing')

          if problems:
              for p in problems:
                  print(f'::error::{p}')
              sys.exit(1)

          print('secure_headers snippet is intact.')
          print(f'Every site and handle imports secure_headers: {sorted(seen)}')
          print('trusted_proxies occurs zero times.')
          EOF

      - name: Assert Hermes gateway autostart is pinned to the default profile
        # The gateway runs as the default profile. A sticky named active profile
        # (e.g. ciso) in the bind-mounted hermes_data/ would otherwise capture a
        # bare `hermes gateway run` and be refused a gateway, leaving the kanban
        # dispatcher down after a recreate. The start command now lives only in
        # the image CMD (the compose overlay no longer overrides it), so this
        # checks hermes/Dockerfile. It fails closed if the pinned invocation is
        # dropped.
        run: |
          if ! grep -Fq 'hermes -p default gateway run --replace' hermes/Dockerfile; then
            echo "::error::Hermes gateway CMD is not pinned to the default profile. Use: hermes -p default gateway run --replace"
            exit 1
          fi
          echo "Hermes gateway autostart is pinned to the default profile."

      - name: Assert the WebUI is pinned to the /opt agent and fails closed
        # The WebUI (PID 1) must load code and Python from /opt/hermes-agent, not
        # from the data-volume copy a production volume still holds. These four
        # strings are what make that true; a future edit that drops one would
        # silently reintroduce the data-volume path. The smoke job proves the
        # behaviour; this stops the removal from merging in the first place.
        run: |
          fail=0
          for needle in \
            'ENV HERMES_WEBUI_AGENT_DIR="${HERMES_INSTALL_DIR}"' \
            'ENV HERMES_WEBUI_PYTHON="${HERMES_INSTALL_DIR}/.hermes/venv/bin/python"' \
            'ENV HERMES_WEBUI_SERVER_CWD="/root/.hermes/webui"' \
            'ENV HERMES_WEBUI_DISABLE_LOCAL_VENV=1' \
            'ENV HERMES_HOME="/root/.hermes"' \
            'ARG HERMES_WEBUI_COMMIT=1e2e4dde6520e5d96bb5b20dfb2f65aa890eeb5e'; do
            if ! grep -Fq "$needle" hermes/Dockerfile; then
              echo "::error::hermes/Dockerfile is missing: ${needle}"
              fail=1
            fi
          done
          if ! grep -Fq -- '--skip-agent-install' hermes/Dockerfile; then
            echo "::error::the WebUI CMD does not pass --skip-agent-install (must fail closed instead of auto-installing)"
            fail=1
          fi
          exit "$fail"

      - name: Assert no secrets are tracked
        # Last line of defence. If .env or a data folder ever got committed,
        # this stops the build and tells you to clean up git history.
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked in git. Remove it from history immediately."
            exit 1
          fi
          if git ls-files | grep -Eq '(^|/)(webui_data|ollama_data)/'; then
            echo "::error::Local database state is tracked in git."
            exit 1
          fi
          # Backup credentials and plaintext staging must never be tracked.
          if git ls-files | grep -Eq '(r2\.env|repo-password|\.backup-staging/|\.restore-work/)'; then
            echo "::error::Backup credentials or staged plaintext are tracked in git."
            exit 1
          fi
          echo "No secrets or local state tracked."
