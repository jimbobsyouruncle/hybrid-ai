name: Security & SAST Checks

# ONE gate for every pull request to main. It is deliberately unfiltered:
# a docs-only change still runs the job so the required checks are always
# present. CodeQL advanced setup replaces the repository's dynamic
# "default setup" (the owner disables that by hand before merging this).
#
# Triggers:
#   pull_request -> opened, synchronize, reopened (the defaults). Note
#     ready_for_review is NOT included, so marking a draft ready re-runs
#     nothing.
#   workflow_dispatch -> manual run.
#   schedule -> a weekly main-branch baseline for CodeQL and a Semgrep
#     rule-drift check. There is no push-to-main trigger: a merge lands
#     through its pull request, and the deploy workflow is the push path.
on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC

# Least privilege at the top level. Only the CodeQL job widens it below.
permissions:
  contents: read

# One in-flight run per pull request (or ref). A new push to the same PR
# cancels the older run instead of queueing behind it.
concurrency:
  group: sast-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  shellcheck:
    name: ShellCheck (Bash)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run ShellCheck
        # The shared path helper (scripts/lib/hybrid-ai-env.sh) is sourced by
        # many scripts and must be followed and analysed, not skipped.
        # check_together is the action's documented remedy for SC1090/SC1091:
        # it runs shellcheck over all files in ONE invocation, so the sourced
        # helper becomes an input. No rule is disabled or ignored.
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          check_together: 'yes'

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Semgrep 1.179.0 (release-1.179.0), pinned by tag AND digest. The
      # digest alone said nothing about which Semgrep release ran.
      image: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: --baseline-commit on a pull request needs the PR
          # base SHA, which the default depth-1 checkout does not contain.
          fetch-depth: 0
      - name: Run Semgrep Rules
        # Diff-aware on pull requests, full tree otherwise. A PR scans only
        # what it changed against the base commit; workflow_dispatch and the
        # weekly schedule keep the whole-tree scan, so the rule-drift check
        # and manual runs still see every file. An absent or empty base SHA
        # (e.g. a schedule event) falls back to the full scan rather than to
        # a scan of nothing, so a diff-aware run can never pass vacuously.
        # Residual: --config auto still resolves rules from the Semgrep
        # registry at run time, so rule CONTENT is not pinned by the image
        # digest even though the Semgrep version is.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "$BASE_SHA" ]; then
            semgrep scan --config auto --error --baseline-commit "$BASE_SHA"
          else
            semgrep scan --config auto --error
          fi

  # The same validation the deploy runs, exposed to pull requests so a
  # mistake is caught before merge rather than on the Pi.
  validate:
    name: Validate sources
    uses: ./.github/workflows/validate.yml

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only this job may write code-scanning results. Everything else stays
    # read-only. `actions: read` lets CodeQL read local action metadata for
    # the `actions` language.
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"

  # Proves the Hermes image runs as a dedicated non-root uid. It builds the
  # image with HYBRID_AI_UID=10001, runs it as 10001 with an empty data dir,
  # no capabilities and no secrets, and checks the WebUI and liveness. The
  # runner is arm64 (ubuntu-24.04-arm) because the supported target is a
  # Raspberry Pi (aarch64).
  hermes-nonroot-smoke:
    name: Hermes non-root smoke
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the Hermes image as uid 10001
        run: |
          docker build \
            --build-arg HYBRID_AI_UID=10001 \
            --build-arg HYBRID_AI_GID=10001 \
            -t hermes-nonroot-smoke hermes

      - name: Run as 10001 and check uid, WebUI and liveness
        run: |
          set -euo pipefail
          DATA="$(mktemp -d)"

          # Seed the data volume with a DECOY agent the way a real host volume
          # carries the old copy. The decoy is a valid Agent source root
          # (run_agent.py + hermes_cli/main.py + cron/jobs.py) that leaves a
          # marker file if anything imports it. The WebUI must pin the /opt
          # agent, so the decoy must never be imported and the marker must
          # never appear. The old copy is NOT deleted (rollback), which is the
          # whole point: pinning must win without removing it. The tree is
          # seeded now, while the runner still owns DATA: the runner cannot
          # write into a tree already owned by 10001, so ownership is applied
          # afterwards.
          mkdir -p "$DATA/hermes-agent/hermes_cli" "$DATA/hermes-agent/cron"
          cat > "$DATA/hermes-agent/run_agent.py" <<'PY'
          # Decoy Agent module. Imported => the WebUI ran the data-volume copy.
          from pathlib import Path
          Path("/root/.hermes/DECOY_AGENT_IMPORTED").write_text("decoy imported\n")
          class AIAgent:  # pragma: no cover
              pass
          PY
          : > "$DATA/hermes-agent/hermes_cli/main.py"
          : > "$DATA/hermes-agent/hermes_cli/__init__.py"
          : > "$DATA/hermes-agent/cron/jobs.py"

          sudo chown 10001:10001 "$DATA"
          sudo chmod 0755 "$DATA"
          sudo chown -R 10001:10001 "$DATA"

          docker run -d --name hermes-nonroot-smoke \
            --user 10001:10001 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -v "$DATA:/root/.hermes" \
            -p 8501:8501 \
            hermes-nonroot-smoke

          # 1. The process identity is the dedicated uid.
          RUN_UID="$(docker exec hermes-nonroot-smoke id -u)"
          echo "container id -u = ${RUN_UID}"
          [ "$RUN_UID" = "10001" ] || { echo "::error::container uid is ${RUN_UID}, expected 10001"; exit 1; }

          # 2. The WebUI answers HTTP 200 on 8501 within 180 s. A dead
          #    container ends the wait early.
          CODE=""
          for _ in $(seq 1 36); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8501/ || true)"
            [ "$CODE" = "200" ] && break
            if [ "$(docker inspect -f '{{.State.Running}}' hermes-nonroot-smoke)" != "true" ]; then
              echo "::error::container exited before the WebUI answered"
              docker logs --tail 60 hermes-nonroot-smoke || true
              exit 1
            fi
            sleep 5
          done
          echo "WebUI HTTP status = ${CODE}"
          [ "$CODE" = "200" ] || { echo "::error::WebUI did not answer 200 within 180 s"; exit 1; }

          # 3. Still running at +60 s.
          sleep 60
          RUNNING="$(docker inspect -f '{{.State.Running}}' hermes-nonroot-smoke)"
          echo "running at +60s = ${RUNNING}"
          [ "$RUNNING" = "true" ] || { echo "::error::container is not running at +60 s"; exit 1; }

          # 4. The Hermes gateway process is up at +60 s, using the same test
          #    doctor.sh uses. The image CMD starts it; nothing else does.
          if ! docker top hermes-nonroot-smoke \
               | grep -Eq '(^|[[:space:]])(hermes[[:space:]]+)?gateway[[:space:]]+run([[:space:]]|$)'; then
            echo "::error::Hermes gateway process is not running at +60 s"
            docker top hermes-nonroot-smoke || true
            docker logs --tail 60 hermes-nonroot-smoke || true
            exit 1
          fi
          echo "Hermes gateway process is running at +60 s."

          # 5. The local kanban patch is present in the pinned checkout. This
          #    proves the build applied hermes/patches/0001-... to the code that
          #    runs, not just that the file ships in the repository.
          docker exec hermes-nonroot-smoke \
            grep -q 'HERMES_KANBAN_PROMPT_BODY_CHARS' \
            /opt/hermes-agent/hermes_cli/kanban_specify.py \
            || { echo "::error::the local kanban patch is missing from the installed code"; exit 1; }
          echo "Local kanban patch is present in /opt/hermes-agent."

      - name: Assert PID 1 runs only the pinned /opt agent, never the data volume
        # The decoy agent seeded above is a valid source root on the data volume
        # (/root/.hermes/hermes-agent). The WebUI (PID 1) must load its code and
        # Python from /opt/hermes-agent only. Three assertions:
        #   a) every mapped venv/site-packages path is under /opt/hermes-agent
        #      and none is under /root/.hermes;
        #   b) the decoy's marker is absent (it was never imported);
        #   c) one HTTP request that loads the Agent path succeeds.
        run: |
          set -euo pipefail

          # a) PID 1's mapped Python paths. `docker exec` a fresh shell would have
          #    the image ENV but not PID 1's own state, so read PID 1 directly:
          #    list its /proc/1/maps and keep the venv/site-packages lines.
          MAPS="$(docker exec hermes-nonroot-smoke sh -c 'cat /proc/1/maps' || true)"
          VENV_LINES="$(echo "${MAPS}" | awk '{print $NF}' | grep -E '/venv/|/site-packages/' || true)"
          echo "--- PID 1 mapped venv/site-packages paths ---"
          echo "${VENV_LINES}"
          if [ -z "${VENV_LINES}" ]; then
            echo "::error::could not read any venv/site-packages path from PID 1's maps"
            exit 1
          fi
          if echo "${VENV_LINES}" | grep -Eq '/root/\.hermes'; then
            echo "::error::PID 1 maps Python from the data volume (/root/.hermes), not /opt/hermes-agent"
            echo "${VENV_LINES}" | grep -E '/root/\.hermes' | head -20
            exit 1
          fi
          if ! echo "${VENV_LINES}" | grep -Eq '/opt/hermes-agent'; then
            echo "::error::PID 1 maps no Python path under /opt/hermes-agent"
            exit 1
          fi
          echo "PID 1 maps Python only from /opt/hermes-agent."

          # b) The decoy was never imported.
          if docker exec hermes-nonroot-smoke \
               test -e /root/.hermes/DECOY_AGENT_IMPORTED; then
            echo "::error::the WebUI imported the data-volume decoy agent (marker present)"
            exit 1
          fi
          echo "The data-volume decoy agent was never imported (no marker)."

          # c) One HTTP request that loads the Agent path. This is the first
          #    request to a fresh, unauthenticated (no password) WebUI, so it
          #    exercises the same startup/agent-load path a browser hits.
          HTTP="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
                    http://127.0.0.1:8501/api/onboarding/status || true)"
          echo "agent-load request status = ${HTTP}"
          [ "$HTTP" = "200" ] || { echo "::error::the agent-path request did not answer 200"; \
                                   docker logs --tail 60 hermes-nonroot-smoke || true; exit 1; }

      - name: Assert hermes resolves in a login shell under /usr/local/bin
        # The bare `hermes` CLI must resolve in every shell, including a login
        # shell that rebuilds PATH from /etc/profile (where the old
        # /root/.local/bin lives). A root-owned /usr/local/bin/hermes symlink
        # guarantees that.
        run: |
          FOUND="$(docker exec hermes-nonroot-smoke bash -lc 'command -v hermes' || true)"
          echo "bash -lc command -v hermes = ${FOUND}"
          [ "$FOUND" = "/usr/local/bin/hermes" ] \
            || { echo "::error::hermes did not resolve to /usr/local/bin/hermes in a login shell"; exit 1; }

      - name: Assert the runtime wrote nothing under /app or /opt
        # /app hosts the WebUI (PID 1) and /opt/hermes-agent hosts the agent
        # code. Both are root-owned and must be immutable to the runtime uid. A
        # hard failure on any A(dd)/C(hange)/D(elete) under either path proves
        # the smoke checks above did not quietly need a writable code tree. This
        # runs after the HTTP request that loads the Agent path, so any bytecode
        # the server would have written has already happened.
        run: |
          DIFF="$(docker diff hermes-nonroot-smoke || true)"
          if echo "${DIFF}" | grep -Eq '^[ACD] /app($|/)|^[ACD] /opt($|/)'; then
            echo "::error::the runtime wrote under /app or /opt"
            echo "${DIFF}" | grep -E '^[ACD] /app($|/)|^[ACD] /opt($|/)' | head -20
            exit 1
          fi
          echo "No writes under /app or /opt."

      - name: Assert Hermes wrote nothing under the immutable install dir
        # `docker diff` is a change type plus a path. The code lives at
        # /opt/hermes-agent, outside every mount and root-owned, so the runtime
        # uid must not write there. Any A(dd), C(hange), or D(elete) under that
        # path is a hard failure: the install is meant to be immutable.
        run: |
          DIFF="$(docker diff hermes-nonroot-smoke || true)"
          if echo "${DIFF}" | grep -Eq '^[ACD] /opt/hermes-agent'; then
            echo "::error::the runtime wrote under /opt/hermes-agent"
            echo "${DIFF}" | grep -E '^[ACD] /opt/hermes-agent' | head -20
            exit 1
          fi
          echo "No writes under /opt/hermes-agent."

      - name: Assert the dependency-lease home is the data volume, not /opt
        # Runtime dependency state (the venv generation lease, .leases) resolves
        # under HERMES_HOME when set, else $HOME/.hermes. It must land on the
        # writable data volume, never the read-only /opt install. The supported
        # routing setting is HERMES_HOME, so prove it is the data volume.
        run: |
          HOME_VAL="$(docker exec hermes-nonroot-smoke printenv HERMES_HOME || true)"
          echo "container HERMES_HOME = '${HOME_VAL}'"
          case "${HOME_VAL}" in
            /opt|/opt/*)
              echo "::error::HERMES_HOME=${HOME_VAL} would move runtime dependency state into the read-only /opt tree"
              exit 1
              ;;
          esac
          [ "$HOME_VAL" = "/root/.hermes" ] \
            || { echo "::error::HERMES_HOME is '${HOME_VAL}', expected the data volume /root/.hermes"; exit 1; }
          echo "HERMES_HOME is the data volume; dependency state (incl. .leases) stays off /opt."

      - name: Show what Hermes writes at first start (paths only)
        # Always runs, so a pull request shows what Hermes writes and where
        # tools install. `docker diff` output is a change type plus a path.
        if: always()
        run: docker diff hermes-nonroot-smoke || true

      - name: Tear down
        if: always()
        run: docker rm -f hermes-nonroot-smoke || true

  # The single required check. It always runs and fails closed: a failure,
  # a cancellation, or a skipped dependency all end non-zero.
  gate:
    name: Security & SAST gate
    if: always()
    needs: [shellcheck, semgrep, validate, codeql, hermes-nonroot-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        run: |
          echo "ShellCheck       : ${{ needs.shellcheck.result }}"
          echo "Semgrep          : ${{ needs.semgrep.result }}"
          echo "Validate sources : ${{ needs.validate.result }}"
          echo "CodeQL           : ${{ needs.codeql.result }}"
          echo "Hermes non-root  : ${{ needs.hermes-nonroot-smoke.result }}"
          failed=0
          for result in \
            "${{ needs.shellcheck.result }}" \
            "${{ needs.semgrep.result }}" \
            "${{ needs.validate.result }}" \
            "${{ needs.codeql.result }}" \
            "${{ needs.hermes-nonroot-smoke.result }}"; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more security checks did not succeed."
            exit 1
          fi
          echo "All security checks succeeded."
