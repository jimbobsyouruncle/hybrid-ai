name: Consolidate Markdown for RAG

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Consolidated Markdown
        run: |
          OUTPUT_FILE="consolidated_docs.md"
          echo "# Repository Documentation Index" > "$OUTPUT_FILE"
          echo "Generated on $(date -u)" >> "$OUTPUT_FILE"
          echo "" >> "$OUTPUT_FILE"

          # Find all .md files excluding the output file itself
          find . -type f -name "*.md" ! -name "$OUTPUT_FILE" | sort | while read -r file; do
            clean_path="${file#./}"
            
            echo "Processing $clean_path..."
            
            echo "---" >> "$OUTPUT_FILE"
            echo "## File: $clean_path" >> "$OUTPUT_FILE"
            echo "" >> "$OUTPUT_FILE"
            
            cat "$file" >> "$OUTPUT_FILE"
            echo -e "\n\n" >> "$OUTPUT_FILE"
          done

      - name: Commit and push consolidated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add consolidated_docs.md
          if git diff --staged --quiet; then
            echo "No changes detected in consolidated documentation."
          else
            git commit -m "chore: update consolidated RAG markdown documentation [skip ci]"
            git push
          fi
