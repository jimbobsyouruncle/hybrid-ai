name: Consolidate Markdown for RAG

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # FIXED: v7 does not exist

      - name: Generate Consolidated Markdown with Frontmatter
        run: |
          OUTPUT_FILE="consolidated_docs.md"
          TMP_FILE="consolidated_docs.tmp"
          
          echo "# Repository RAG Corpus" > "$TMP_FILE"
          echo "Generated on $(date -u)" >> "$TMP_FILE"
          echo "" >> "$TMP_FILE"

          # Write to a temporary file first to avoid truncation
          find . -type f -name "*.md" ! -name "$OUTPUT_FILE" ! -path '*/.*' | sort | while read -r file; do
            clean_path="${file#./}"
            filename=$(basename "$clean_path")
            directory=$(dirname "$clean_path")
            word_count=$(wc -w < "$file" | tr -d ' ')
            line_count=$(wc -l < "$file" | tr -d ' ')
            
            title=$(grep -m 1 '^# ' "$file" | sed 's/^# //' | sed 's/"/\\"/g')
            if [ -z "$title" ]; then
              title="$filename"
            fi

            {
              echo "---"
              echo "source_path: \"$clean_path\""
              echo "filename: \"$filename\""
              echo "directory: \"$directory\""
              echo "title: \"$title\""
              echo "word_count: $word_count"
              echo "line_count: $line_count"
              echo "---"
              echo ""
              cat "$file"
              echo -e "\n"
            } >> "$TMP_FILE"
          done
          
          # Safely rename the tmp file to the final markdown file
          mv "$TMP_FILE" "$OUTPUT_FILE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add consolidated_docs.md
          if git diff --staged --quiet; then
            echo "No changes in consolidated file."
          else
            git commit -m "chore: update consolidated RAG markdown [skip ci]"
            git push
          fi
