# ---------------------------------------------------------------------------
# FILE: .github/workflows/deploy.yml
# PURPOSE (plain English):
#   This is an automation recipe that GitHub runs for you. Every time you push
#   code to the "main" branch, GitHub rents a temporary computer (a "runner"),
#   which then:
#
#     1. Checks your code for syntax errors and accidentally committed secrets.
#     2. Joins your private Tailscale network as a temporary member.
#     3. Connects to your Raspberry Pi over SSH using that private network.
#     4. Pulls the new code and re-runs install.sh.
#     5. Confirms the site came back up, and fails loudly if it did not.
#
#   The clever part is step 2: your Pi never needs a public IP address, an open
#   firewall port, or port forwarding on your home router. GitHub's runner
#   joins your private network for the ~2 minutes it needs, then disappears.
#
# DATA SAFETY:
#   This workflow never runs "docker compose down -v", never touches the
#   webui_data or ollama_data folders, and never writes .env directly. Because
#   install.sh preserves every value it finds, your login sessions survive a
#   deploy untouched.
#
# SECRETS YOU MUST ADD FIRST:
#   GitHub repo -> Settings -> Secrets and variables -> Actions -> New secret
#
#     TS_OAUTH_CLIENT_ID   Tailscale OAuth client ID  (scope: auth_keys, tag:ci)
#     TS_OAUTH_SECRET      Tailscale OAuth client secret
#     PI_TAILSCALE_IP      100.x.x.x address of your Pi
#     PI_SSH_USER          SSH username on the Pi, e.g. pi
#     PI_SSH_KEY           private SSH key authorised on the Pi
#     PI_REPO_PATH         absolute path to the checkout, e.g. /home/pi/hybrid-ai
#
#   You must also add an ACL rule in Tailscale allowing tag:ci to reach the Pi
#   on port 22. Full walkthrough in .github/README.md.
# ---------------------------------------------------------------------------

name: Deploy Control Plane

# "on:" decides when this runs.
on:
  push:
    branches: [main]
    paths-ignore:
      # Do not burn a deploy on a documentation typo.
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:      # adds a manual "Run workflow" button in the UI
    inputs:
      restart_stack:
        description: "Recreate containers even if images are unchanged"
        required: false
        default: "false"

# Only one deploy at a time. Without this, two quick pushes could have two
# runners reconfiguring the same Pi simultaneously.
concurrency:
  group: deploy-control-plane
  cancel-in-progress: false

permissions:
  contents: read          # least privilege: the job only needs to read code

jobs:

  # =========================================================================
  # JOB 1: validate -- catch mistakes before they reach the Pi
  # =========================================================================
  validate:
    name: Validate sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax check
        # "bash -n" parses a script without running it. Catches typos and
        # unbalanced quotes safely.
        run: |
          bash -n install.sh
          bash -n runpod/start.sh
          bash -n backup/backup.sh
          bash -n backup/restore.sh
          bash -n doctor.sh
          bash -n collect-diagnostics.sh

      - name: Shellcheck
        # A linter that flags common shell scripting bugs. Advisory only --
        # continue-on-error means it reports but does not block the deploy.
        #
        # SECURITY: pinned to a release tag, never @master. A mutable ref means
        # whatever that branch points at today runs inside your CI job with
        # access to your secrets. Pin third-party actions; prefer a full commit
        # SHA over a tag for anything that touches credentials.
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: error
          scandir: "."
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax check
        run: python -m py_compile openwebui/runpod_pipe.py

      - name: Compose schema check
        # Dummy values just so the file can be parsed. "config --quiet"
        # validates structure without starting anything.
        run: |
          set -a
          OLLAMA_MAX_VRAM=1 TAILSCALE_IP=100.64.0.1 RUNPOD_API_KEY=x \
          RUNPOD_POD_ID=x WEBUI_SECRET_KEY=x STATUS_UID=1000 DOCKER_GID=999 \
          OLLAMA_MEM_LIMIT=8g WEBUI_MEM_LIMIT=3g OLLAMA_CPUS=3.5 WEBUI_CPUS=2.0
          set +a
          docker compose -f docker-compose.yml config --quiet

      - name: Assert proxy allowlist is intact
        # A future edit could remove `import trusted_only` from a sensitive
        # route and silently expose the status page or the unauthenticated
        # Ollama API. This fails the build if that happens.
        run: |
          python - <<'EOF'
          import re, sys
          cfg = open('status/Caddyfile').read()
          must_protect = {'/hub*', '/status*', '/ollama/*'}
          found = {}
          for m in re.finditer(r'handle(?:_path)?\s+(\S+)\s*\{(.*?)\n\t\}', cfg, re.S):
              found[m.group(1)] = 'trusted_only' in m.group(2)
          missing = [r for r in must_protect if not found.get(r)]
          if missing:
              print(f"::error::Routes missing the IP allowlist: {missing}")
              sys.exit(1)
          print(f"All sensitive routes protected: {sorted(must_protect)}")
          EOF

      - name: Assert no secrets are tracked
        # Last line of defence. If .env or a data folder ever got committed,
        # this stops the build and tells you to clean up git history.
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked in git. Remove it from history immediately."
            exit 1
          fi
          if git ls-files | grep -Eq '(^|/)(webui_data|ollama_data)/'; then
            echo "::error::Local database state is tracked in git."
            exit 1
          fi
          # Backup credentials and plaintext staging must never be tracked.
          if git ls-files | grep -Eq '(r2\.env|repo-password|\.backup-staging/|\.restore-work/)'; then
            echo "::error::Backup credentials or staged plaintext are tracked in git."
            exit 1
          fi
          echo "No secrets or local state tracked."

  # =========================================================================
  # JOB 2: deploy -- only runs if validate passed
  # =========================================================================
  deploy:
    name: Deploy over Tailscale
    needs: validate          # gate: do not start until validation succeeds
    runs-on: ubuntu-latest
    environment: production  # lets you require manual approval in repo settings
    steps:
      - name: Connect to tailnet
        # Joins the runner to your private network as an ephemeral node tagged
        # "tag:ci". It is removed automatically when the job ends.
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      - name: Verify Pi is reachable
        # Retry for up to ~50 seconds. Mesh routes take a moment to establish,
        # and failing here gives a much clearer error than a mysterious SSH
        # timeout further down.
        run: |
          echo "Runner mesh address: $(tailscale ip -4)"
          for i in $(seq 1 10); do
            if tailscale ping --c 1 --timeout 5s "${{ secrets.PI_TAILSCALE_IP }}" >/dev/null 2>&1; then
              echo "Pi reachable over the mesh."
              exit 0
            fi
            echo "attempt $i: no response yet..."
            sleep 5
          done
          echo "::error::Pi at ${{ secrets.PI_TAILSCALE_IP }} is unreachable over the tailnet."
          exit 1

      - name: Pull and reprovision
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PI_TAILSCALE_IP }}
          username: ${{ secrets.PI_SSH_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          port: 22
          # SECURITY: verify the Pi's SSH host key instead of blindly trusting
          # whatever answers. Without this, anything able to occupy that
          # address could impersonate the Pi and harvest the deploy key.
          # Populate PI_SSH_HOST_KEY with the output of:
          #   ssh-keyscan -t ed25519 <pi-tailscale-ip>
          fingerprint: ${{ secrets.PI_SSH_HOST_KEY }}
          command_timeout: 20m
          script_stop: true       # abort on the first failing command
          envs: RESTART_STACK
          script: |
            set -Eeuo pipefail
            cd "${{ secrets.PI_REPO_PATH }}"

            echo "==> Pre-deploy state"
            du -sh webui_data ollama_data 2>/dev/null || true

            echo "==> Fetching latest"
            git fetch --all --prune
            # "reset --hard" makes the Pi match the repo exactly. Safe here
            # because .gitignore keeps all your real data untracked.
            git reset --hard origin/main
            chmod +x install.sh runpod/start.sh

            echo "==> Reprovisioning (non-interactive; existing .env preserved)"
            ./install.sh --non-interactive

            echo "==> Post-deploy verification"
            chmod +x doctor.sh 2>/dev/null || true
            sleep 20
            docker compose --env-file .env ps

            # Poll the health endpoint for up to two minutes. If it never comes
            # back, dump the last 50 log lines so the failure is diagnosable
            # straight from the GitHub Actions output.
            for i in $(seq 1 12); do
              if curl -fsS http://localhost:3000/health >/dev/null 2>&1; then
                echo "Open WebUI healthy."
                break
              fi
              echo "waiting for Open WebUI... ($i/12)"
              sleep 10
              if [ "$i" -eq 12 ]; then
                echo "::error::Open WebUI failed its health check."
                docker compose --env-file .env logs --tail 50 open-webui
                exit 1
              fi
            done

            # Full health report in the workflow output, so a failed deploy is
            # diagnosable without SSHing in. Never fails the build by itself.
            if [ -x ./doctor.sh ]; then
              echo "==> Health report"
              ./doctor.sh --no-cloud || true
            fi

            echo "==> Persistent data intact:"
            du -sh webui_data ollama_data 2>/dev/null || true

            # Backups are a data-loss control; a deploy that silently disables
            # them is worth flagging even though it is not a failure.
            if systemctl --user is-active hybrid-ai-backup.timer >/dev/null 2>&1; then
              echo "Backup timer active. Next run:"
              systemctl --user list-timers hybrid-ai-backup.timer --no-pager 2>/dev/null | head -3
            else
              echo "::warning::Backup timer is not active on this host."
            fi

            # Reclaim SD card space from superseded images.
            docker image prune -f >/dev/null 2>&1 || true
        env:
          RESTART_STACK: ${{ github.event.inputs.restart_stack || 'false' }}

      - name: Summary
        # "if: always()" means this runs even when the deploy failed, so you
        # always get a readable summary on the workflow page.
        if: always()
        run: |
          {
            echo "### Control plane deploy"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA::8}\` |"
            echo "| Target | \`${{ secrets.PI_TAILSCALE_IP }}\` |"
            echo "| Result | ${{ job.status }} |"
            echo ""
            echo "Persistent mounts (\`webui_data\`, \`ollama_data\`) were not modified."
          } >> "$GITHUB_STEP_SUMMARY"
