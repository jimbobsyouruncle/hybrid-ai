# ---------------------------------------------------------------------------
# FILE: .github/workflows/deploy.yml
# PURPOSE (plain English):
#   This is an automation recipe that GitHub runs for you. Every time you push
#   code to the "main" branch, GitHub rents a temporary computer (a "runner"),
#   which then:
#
#     1. Checks your code for syntax errors and accidentally committed secrets.
#     2. Joins your private Tailscale network as a temporary member.
#     3. Confirms the Pi answers on that private network.
#     4. Connects to the Pi as the dedicated `hybrid-ai-deploy` account and
#        sends exactly one command: `deploy <sha>`.
#     5. The forced command on the Pi starts the system unit
#        hybrid-ai-deploy@<sha>.service, which pulls the validated revision,
#        reprovisions the host and gates on doctor.sh.
#     6. Fails loudly if the unit did not finish successfully.
#
#   The clever part is step 2: your Pi never needs a public IP address, an open
#   firewall port, or port forwarding on your home router. GitHub's runner
#   joins your private network for the ~2 minutes it needs, then disappears.
#
#   WHY THE RUNNER NO LONGER RUNS A SHELL SCRIPT ON THE PI:
#     The runner used to log in as the admin account and run git and install.sh
#     over SSH. That is gone. The deploy account's SSH key is pinned to ONE
#     forced command, so the connection can only start the deploy unit. The
#     ancestor check, the reset to the exact SHA and the HEAD assert all happen
#     inside scripts/deploy-instance.sh, which the unit runs as root.
#
# DATA SAFETY:
#   This workflow never runs "docker compose down -v", never touches the
#   webui_data or ollama_data folders, and never writes .env directly. Because
#   install.sh preserves every value it finds, your login sessions survive a
#   deploy untouched.
#
# SECRETS YOU MUST ADD FIRST:
#   GitHub repo -> Settings -> Secrets and variables -> Actions -> New secret
#
#     TS_OAUTH_CLIENT_ID   Tailscale OAuth client ID  (scope: auth_keys, tag:ci)
#     TS_OAUTH_SECRET      Tailscale OAuth client secret
#     PI_TAILSCALE_FULL_DOMAIN
#                          Your Pi's MagicDNS name exactly as Tailscale lists
#                          it, e.g. jarvis.tailXXXX.ts.net (a NAME, not an
#                          address). A re-registered Pi keeps its name but can
#                          change its mesh address, so target the name.
#     PI_SSH_KEY           private SSH key authorised on the Pi as the
#                          `hybrid-ai-deploy` account (the key line is pinned
#                          to the forced command, scripts/deploy-forced-command.sh)
#     PI_SSH_HOST_KEY      SHA256 fingerprint of the Pi's SSH host key:
#                            ssh-keyscan -t ed25519 <pi-magicdns-name> | ssh-keygen -lf -
#                          Use the SHA256:... field. scripts/deploy-trigger.sh
#                          compares the scanned fingerprint against this value
#                          and refuses to connect on any mismatch.
#
#     PI_SSH_USER          UNUSED. The deploy no longer logs in as the admin
#                          account; the login name is the literal
#                          `hybrid-ai-deploy`. May be deleted by the owner.
#     PI_REPO_PATH         UNUSED. The remote path is resolved on the host by
#                          scripts/deploy-instance.sh via HYBRID_AI_APP_DIR.
#                          May be deleted by the owner.
#
#   You must also add an ACL rule in Tailscale allowing tag:ci to reach the Pi
#   on port 22. Full walkthrough in .github/README.md.
# ---------------------------------------------------------------------------

name: Deploy Control Plane

# "on:" decides when this runs.
on:
  push:
    branches: [main]
    paths-ignore:
      # Do not burn a deploy on a documentation typo.
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:      # adds a manual "Run workflow" button in the UI

# Only one deploy at a time. Without this, two quick pushes could have two
# runners reconfiguring the same Pi simultaneously.
concurrency:
  group: deploy-control-plane
  cancel-in-progress: false

permissions:
  contents: read          # least privilege: the job only needs to read code

jobs:

  # =========================================================================
  # JOB 1: validate -- catch mistakes before they reach the Pi
  # =========================================================================
  # Reuses the same validation the pull-request gate runs, so nothing
  # reaches the Pi that has not already passed on a pull request. No
  # secrets are passed in.
  validate:
    uses: ./.github/workflows/validate.yml

  # =========================================================================
  # JOB 2: deploy -- only runs if validate passed
  # =========================================================================
  deploy:
    name: Deploy over Tailscale
    needs: validate          # gate: do not start until validation succeeds
    runs-on: ubuntu-latest
    environment: production  # lets you require manual approval in repo settings
    steps:
      - name: Checkout
        # The runner now calls a tracked script (scripts/deploy-trigger.sh),
        # so it needs the repository present. Credentials are not persisted:
        # the deploy authenticates with the dedicated deploy key, not with the
        # GitHub token, and nothing here pushes.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for the sandbox image
        # Fail-closed pre-flight gate. Before the runner joins the tailnet and
        # triggers the remote install, this waits until the sandbox image the
        # host will pull is published on GHCR. Without it, a deploy could race
        # the sandbox-image build and start install.sh while the manifest is
        # still missing -- the race that produced the "OpenHands workspace ACLs
        # not applied" warning on the 0b4cb53 deploy. It needs no token and no
        # tailnet; permissions stay contents: read. 36 minutes clears the build
        # workflow's 30-minute ceiling.
        run: ./scripts/deploy-image-gate.sh
        timeout-minutes: 36

      - name: Connect to tailnet
        # Joins the runner to your private network as an ephemeral node tagged
        # "tag:ci". It is removed automatically when the job ends.
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: '1.104.1'

      - name: Verify MagicDNS resolves the Pi inside the mesh
        env:
          PI_NAME: ${{ secrets.PI_TAILSCALE_FULL_DOMAIN }}
        run: |
          set -u
          if [ -z "${PI_NAME:-}" ]; then
            echo "::error::PI_TAILSCALE_FULL_DOMAIN is empty or unset; cannot resolve the Pi's MagicDNS name."
            exit 1
          fi
          name="${PI_NAME%.}"
          resolved="$(tailscale ip -4 "$name" 2>/dev/null | head -n1 || true)"
          if [ -z "$resolved" ]; then
            resolved="$(getent ahostsv4 "$name" 2>/dev/null | awk '{print $1; exit}' || true)"
          fi
          if [ -z "$resolved" ]; then
            echo "::error::MagicDNS did not resolve '$name' to any address. Likely causes: MagicDNS disabled for this tailnet/runner, or PI_TAILSCALE_FULL_DOMAIN is not the Pi's MagicDNS NAME (get the peer DNSName without its trailing dot from 'tailscale status' on the Pi)."
            exit 1
          fi
          o2="${resolved#*.}"
          o2="${o2%%.*}"
          case "$o2" in
            ''|*[!0-9]*)
              echo "::error::Resolved address for '$name' has a malformed second octet; refusing to deploy."
              exit 1
              ;;
          esac
          if [ "${resolved%%.*}" != "100" ] || [ "$o2" -lt 64 ] || [ "$o2" -gt 127 ]; then
            echo "::error::'$name' resolves outside the tailnet mesh range (second octet not 64-127); refusing to deploy off-tunnel."
            exit 1
          fi
          echo "MagicDNS ok: '$name' resolves to a mesh address."

      - name: Verify Pi is reachable
        # Retry for up to ~50 seconds. Mesh routes take a moment to establish,
        # and failing here gives a much clearer error than a mysterious SSH
        # timeout further down.
        run: |
          echo "Runner mesh address: $(tailscale ip -4)"
          for i in $(seq 1 10); do
            if tailscale ping --c 1 --timeout 5s "${{ secrets.PI_TAILSCALE_FULL_DOMAIN }}" >/dev/null 2>&1; then
              echo "Pi reachable over the mesh."
              exit 0
            fi
            echo "attempt $i: no response yet..."
            sleep 5
          done
          echo "::error::Pi at ${{ secrets.PI_TAILSCALE_FULL_DOMAIN }} is unreachable over the tailnet."
          exit 1

      - name: Trigger deploy
        # Connects as the dedicated `hybrid-ai-deploy` account and sends
        # EXACTLY one command string: `deploy <sha>`. The account's key is
        # pinned to the forced command, so this is all the connection can do.
        #
        # Secrets arrive only through this env: block; none is interpolated
        # into the run: body. GITHUB_SHA is the runner-provided commit CI
        # validated. scripts/deploy-trigger.sh validates the sha, verifies the
        # Pi's host key fingerprint BEFORE authenticating, writes the private
        # key mode 0600 under $RUNNER_TEMP, and removes it on every exit path.
        #
        # 60 min is STRICTLY longer than the deploy unit's TimeoutStartSec
        # (45 min, deploy/hybrid-ai-deploy@.service). Keep that order: the unit
        # gives up first, so this step outlives it and reports the real
        # Result= instead of being killed mid-deploy.
        timeout-minutes: 60
        env:
          PI_HOST: ${{ secrets.PI_TAILSCALE_FULL_DOMAIN }}
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_HOST_KEY: ${{ secrets.PI_SSH_HOST_KEY }}
        run: |
          ./scripts/deploy-trigger.sh "$GITHUB_SHA"

      - name: Clean up temporary SSH key material
        # Second line of defence. deploy-trigger.sh removes the temporary key
        # and the scanned known_hosts file itself, but this runs on EVERY
        # exit path (even a cancelled or failed step) so nothing lingers on
        # the runner. It prints no secret value.
        if: always()
        run: |
          rm -f -- "${RUNNER_TEMP}/hybrid-ai-deploy-key" \
                   "${RUNNER_TEMP}/hybrid-ai-deploy-known_hosts"

      - name: Summary
        # "if: always()" means this runs even when the deploy failed, so you
        # always get a readable summary on the workflow page.
        if: always()
        run: |
          {
            echo "### Control plane deploy"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA::8}\` |"
            echo "| Target | \`${{ secrets.PI_TAILSCALE_FULL_DOMAIN }}\` |"
            echo "| Result | ${{ job.status }} |"
            echo ""
            echo "Persistent mounts (\`webui_data\`, \`ollama_data\`) were not modified."
          } >> "$GITHUB_STEP_SUMMARY"
