# ---------------------------------------------------------------------------
# FILE: .github/workflows/deploy.yml
# PURPOSE (plain English):
#   This is an automation recipe that GitHub runs for you. Every time you push
#   code to the "main" branch, GitHub rents a temporary computer (a "runner"),
#   which then:
#
#     1. Checks your code for syntax errors and accidentally committed secrets.
#     2. Joins your private Tailscale network as a temporary member.
#     3. Connects to your Raspberry Pi over SSH using that private network.
#     4. Pulls the new code and re-runs install.sh.
#     5. Confirms the site came back up, and fails loudly if it did not.
#
#   The clever part is step 2: your Pi never needs a public IP address, an open
#   firewall port, or port forwarding on your home router. GitHub's runner
#   joins your private network for the ~2 minutes it needs, then disappears.
#
# DATA SAFETY:
#   This workflow never runs "docker compose down -v", never touches the
#   webui_data or ollama_data folders, and never writes .env directly. Because
#   install.sh preserves every value it finds, your login sessions survive a
#   deploy untouched.
#
# SECRETS YOU MUST ADD FIRST:
#   GitHub repo -> Settings -> Secrets and variables -> Actions -> New secret
#
#     TS_OAUTH_CLIENT_ID   Tailscale OAuth client ID  (scope: auth_keys, tag:ci)
#     TS_OAUTH_SECRET      Tailscale OAuth client secret
#     PI_TAILSCALE_IP      100.x.x.x address of your Pi
#     PI_SSH_USER          SSH username on the Pi, e.g. pi
#     PI_SSH_KEY           private SSH key authorised on the Pi
#     PI_REPO_PATH         absolute path to the checkout, e.g. /home/pi/hybrid-ai
#     PI_SSH_HOST_KEY      SHA256 fingerprint of the Pi's SSH host key:
#                            ssh-keyscan -t ed25519 <pi-ip> | ssh-keygen -lf -
#                          Use the SHA256:... field. A raw known_hosts line is
#                          NOT accepted by the action and silently disables
#                          host verification.
#
#   You must also add an ACL rule in Tailscale allowing tag:ci to reach the Pi
#   on port 22. Full walkthrough in .github/README.md.
# ---------------------------------------------------------------------------

name: Deploy Control Plane

# "on:" decides when this runs.
on:
  push:
    branches: [main]
    paths-ignore:
      # Do not burn a deploy on a documentation typo.
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:      # adds a manual "Run workflow" button in the UI

# Only one deploy at a time. Without this, two quick pushes could have two
# runners reconfiguring the same Pi simultaneously.
concurrency:
  group: deploy-control-plane
  cancel-in-progress: false

permissions:
  contents: read          # least privilege: the job only needs to read code

jobs:

  # =========================================================================
  # JOB 1: validate -- catch mistakes before they reach the Pi
  # =========================================================================
  # Reuses the same validation the pull-request gate runs, so nothing
  # reaches the Pi that has not already passed on a pull request. No
  # secrets are passed in.
  validate:
    uses: ./.github/workflows/validate.yml

  # =========================================================================
  # JOB 2: deploy -- only runs if validate passed
  # =========================================================================
  deploy:
    name: Deploy over Tailscale
    needs: validate          # gate: do not start until validation succeeds
    runs-on: ubuntu-latest
    environment: production  # lets you require manual approval in repo settings
    steps:
      - name: Connect to tailnet
        # Joins the runner to your private network as an ephemeral node tagged
        # "tag:ci". It is removed automatically when the job ends.
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: '1.104.1'

      - name: Verify Pi is reachable
        # Retry for up to ~50 seconds. Mesh routes take a moment to establish,
        # and failing here gives a much clearer error than a mysterious SSH
        # timeout further down.
        run: |
          echo "Runner mesh address: $(tailscale ip -4)"
          for i in $(seq 1 10); do
            if tailscale ping --c 1 --timeout 5s "${{ secrets.PI_TAILSCALE_IP }}" >/dev/null 2>&1; then
              echo "Pi reachable over the mesh."
              exit 0
            fi
            echo "attempt $i: no response yet..."
            sleep 5
          done
          echo "::error::Pi at ${{ secrets.PI_TAILSCALE_IP }} is unreachable over the tailnet."
          exit 1

      - name: Pull and reprovision
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.PI_TAILSCALE_IP }}
          username: ${{ secrets.PI_SSH_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          port: 22
          # SECURITY: verify the Pi's SSH host key instead of blindly trusting
          # whatever answers. Without this, anything able to occupy that
          # address could impersonate the Pi and harvest the deploy key.
          # Populate PI_SSH_HOST_KEY with the output of:
          #   ssh-keyscan -t ed25519 <pi-tailscale-ip>
          fingerprint: ${{ secrets.PI_SSH_HOST_KEY }}
          command_timeout: 20m
          script_stop: true       # abort on the first failing command
          script: |
            set -Eeuo pipefail
            cd "${{ secrets.PI_REPO_PATH }}"

            echo "==> Pre-deploy state"
            du -sh webui_data ollama_data 2>/dev/null || true

            echo "==> Fetching origin"
            git fetch origin --prune

            # Deploy the EXACT revision CI validated. If main moved after
            # validation, or a manual run targets a non-main branch, resetting
            # to origin/main would deploy an unvalidated tree.
            SHA="${{ github.sha }}"
            if ! git merge-base --is-ancestor "$SHA" origin/main; then
              echo "::error::Validated revision $SHA is not an ancestor of origin/main. Refusing to deploy."
              exit 1
            fi

            # "reset --hard" makes the Pi match the repo exactly. Safe here
            # because .gitignore keeps all your real data untracked.
            git reset --hard "$SHA"

            if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
              echo "::error::After reset, HEAD is $(git rev-parse HEAD) but expected $SHA."
              exit 1
            fi

            # install.sh chmods the rest itself, but it cannot run if it is
            # not executable to begin with.
            chmod +x scripts/deploy-remote.sh

            # Hand off to the tracked remote-deploy script, which re-asserts
            # HEAD == $SHA as its first action, reprovisions, and gates on
            # doctor.sh (exit 2 now fails the deploy).
            exec ./scripts/deploy-remote.sh "$SHA"

      - name: Summary
        # "if: always()" means this runs even when the deploy failed, so you
        # always get a readable summary on the workflow page.
        if: always()
        run: |
          {
            echo "### Control plane deploy"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA::8}\` |"
            echo "| Target | \`${{ secrets.PI_TAILSCALE_IP }}\` |"
            echo "| Result | ${{ job.status }} |"
            echo ""
            echo "Persistent mounts (\`webui_data\`, \`ollama_data\`) were not modified."
          } >> "$GITHUB_STEP_SUMMARY"
