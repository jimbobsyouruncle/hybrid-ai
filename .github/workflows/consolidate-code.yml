name: Consolidate Code for RAG

on:
  push:
    branches:
      - main
    paths:
      - '**/*.py'
      - '**/*.sh'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/Dockerfile'
  workflow_dispatch:

# FIXED: Explicitly grant write access so the bot can commit the new file
permissions:
  contents: write

jobs:
  consolidate:
    uses: jimbobsyouruncle/shared-actions/.github/workflows/consolidate-code.yml@98ce6846e072af3aaf5ccd44f15063d5d29afaf5 # main as of 2026-10-13
